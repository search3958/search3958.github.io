<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>風の紙 - Paper Wind Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    overflow: hidden;
    width: 100%; height: 100%;
    background: #040508;
    font-family: 'Noto Serif JP', serif;
  }
  canvas { display: block; }

  .bg-glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(160px); /* ぼかしを少し強く */
    pointer-events: none;
    z-index: 0;
  }
  .bg-glow.warm {
    width: 600px; height: 600px;
    top: 10%; left: 20%;
    background: #ff2a2a; /* より鮮やかに */
    opacity: 0.05;
  }
  .bg-glow.cool {
    width: 550px; height: 550px;
    top: 45%; right: 10%;
    background: #2a52ff;
    opacity: 0.05;
  }
  .bg-glow.accent {
    width: 400px; height: 400px;
    bottom: 5%; left: 45%;
    background: #2aff70;
    opacity: 0.04;
  }

  .title {
    position: fixed;
    top: 24px; left: 50%;
    transform: translateX(-50%);
    color: rgba(200,220,255,0.5);
    font-weight: 300;
    font-size: 18px;
    letter-spacing: 0.5em;
    pointer-events: none;
    z-index: 10;
    text-shadow: 0 0 30px rgba(100,150,255,0.2);
  }

  .hint {
    position: fixed;
    bottom: 22px; left: 50%;
    transform: translateX(-50%);
    color: rgba(200,220,255,0.25);
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.12em;
    pointer-events: none;
    z-index: 10;
    transition: opacity 1s ease;
  }

  /* パラメータコントロール */
  .ctrl-toggle {
    position: fixed;
    top: 16px; right: 16px;
    width: 32px; height: 32px;
    background: rgba(200,220,255,0.08);
    border: 1px solid rgba(200,220,255,0.15);
    border-radius: 6px;
    color: rgba(200,220,255,0.5);
    font-size: 16px;
    cursor: pointer;
    z-index: 20;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.3s;
    backdrop-filter: blur(8px);
  }
  .ctrl-toggle:hover { background: rgba(200,220,255,0.15); }

  .ctrl-panel {
    position: fixed;
    top: 56px; right: 16px;
    width: 220px;
    background: rgba(10,12,20,0.9);
    border: 1px solid rgba(200,220,255,0.1);
    border-radius: 10px;
    padding: 14px 16px;
    z-index: 20;
    backdrop-filter: blur(12px);
    transition: opacity 0.3s, transform 0.3s;
  }
  .ctrl-panel.hidden {
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
  }
  .ctrl-panel label {
    display: block;
    color: rgba(200,220,255,0.4);
    font-size: 11px;
    letter-spacing: 0.05em;
    margin-bottom: 3px;
    font-weight: 300;
  }
  .ctrl-panel input[type="range"] {
    width: 100%;
    margin-bottom: 10px;
    accent-color: #4a80c8;
    height: 3px;
  }
  .ctrl-panel .val {
    float: right;
    color: rgba(100,180,255,0.6);
    font-size: 10px;
  }

  @media (max-width: 600px) {
    .title { font-size: 14px; letter-spacing: 0.3em; }
    .ctrl-panel { width: 180px; }
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400&display=swap" rel="stylesheet">
</head>
<body>

<div class="bg-glow warm"></div>
<div class="bg-glow cool"></div>
<div class="bg-glow accent"></div>

<div class="title">風の紙</div>
<div class="hint" id="hint">マウスを動かして風を起こす</div>

<button class="ctrl-toggle" id="ctrlToggle" aria-label="設定パネル切替">&#9881;</button>
<div class="ctrl-panel" id="ctrlPanel">
  <label>バネ強さ <span class="val" id="vStiff">92</span></label>
  <input type="range" id="rStiff" min="10" max="200" value="92">
  <label>ダンピング <span class="val" id="vDamp">14</span></label>
  <input type="range" id="rDamp" min="0.5" max="25" value="14" step="0.5">
  <label>風力 <span class="val" id="vWind">6</span></label>
  <input type="range" id="rWind" min="1" max="120" value="6">
  <label>風の半径 <span class="val" id="vRadius">11</span></label>
  <input type="range" id="rRadius" min="1" max="30" value="11">
  <label>伝播率 <span class="val" id="vProp">0.32</span></label>
  <input type="range" id="rProp" min="0" max="0.8" value="0.32" step="0.01">
  <label>曲げ量 <span class="val" id="vBend">0.55</span></label>
  <input type="range" id="rBend" min="0" max="1.5" value="0.55" step="0.05">
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ===== 定数 ===== */
const PANEL_W = 18.0; // さらに2倍 (9.0 -> 18.0)
const PANEL_H = 13.86; // アスペクト比を維持
const SEG_X = 8;
const SEG_Y = 6;

/* ===== 調整可能パラメータ ===== */
const params = {
  stiffness: 92,
  damping: 14,
  windScale: 6,
  windRadius: 11,
  propagation: 0.32,
  windDecay: 0.96,
  bendAmount: 0.55,
  baseAngle: Math.PI * 0.12, // 手前を向くように正の値に変更
};

/* ===== UIコントロール ===== */
const ctrlToggle = document.getElementById('ctrlToggle');
const ctrlPanel = document.getElementById('ctrlPanel');
ctrlToggle.addEventListener('click', () => {
  ctrlPanel.classList.toggle('hidden');
});

// スライダーバインド
function bindSlider(id, param, valId) {
  const slider = document.getElementById(id);
  const valEl = document.getElementById(valId);
  slider.addEventListener('input', () => {
    params[param] = parseFloat(slider.value);
    valEl.textContent = slider.value;
  });
}
bindSlider('rStiff', 'stiffness', 'vStiff');
bindSlider('rDamp', 'damping', 'vDamp');
bindSlider('rWind', 'windScale', 'vWind');
bindSlider('rRadius', 'windRadius', 'vRadius');
bindSlider('rProp', 'propagation', 'vProp');
bindSlider('rBend', 'bendAmount', 'vBend');

/* ===== Three.js 初期化 ===== */
const scene = new THREE.Scene();
scene.background = new THREE.Color('#040508');
scene.fog = new THREE.FogExp2('#040508', 0.015);

const camera = new THREE.PerspectiveCamera(
  45, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.set(0, -2, 55); // カメラを前に戻す (120 -> 55)
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0; // 露出を下げて色を濃く出す (1.4 -> 1.0)
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 20;
controls.maxDistance = 300; 
controls.maxPolarAngle = Math.PI * 0.88;

/* ===== ライティング ===== */
scene.add(new THREE.AmbientLight('#ffffff', 0.8)); // 環境光を少し強めて陰影を和らげる

const dirLight1 = new THREE.DirectionalLight('#ffffff', 1.5); // 直接光を弱めて白飛びを防ぐ
dirLight1.position.set(30, 50, 80);
dirLight1.castShadow = true;
dirLight1.shadow.mapSize.set(2048, 2048);
const sc = dirLight1.shadow.camera;
sc.near = 1; sc.far = 250;
sc.left = -60; sc.right = 60; sc.top = 60; sc.bottom = -60;
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight('#ffffff', 0.5); 
dirLight2.position.set(-40, -30, 40);
scene.add(dirLight2);

const rimLight = new THREE.DirectionalLight('#ffffff', 0.3);
rimLight.position.set(0, 0, -60);
scene.add(rimLight);

// マウス追従ライト
const mouseLight = new THREE.PointLight('#ffffff', 0, 40, 1.2); 
mouseLight.position.set(0, 0, 5);
scene.add(mouseLight);

/* ===== 手パネル生成 (Async Init) ===== */
const textureLoader = new THREE.TextureLoader();
const handTexture = textureLoader.load('hand.svg');

const geometry = new THREE.PlaneGeometry(PANEL_W, PANEL_H, SEG_X, SEG_Y);
// 右辺をピボットにする（左向きに振れるように）ためX方向にマイナスオフセット
geometry.translate(-PANEL_W / 2, 0, 0);

const material = new THREE.MeshStandardMaterial({
  map: handTexture,
  side: THREE.DoubleSide,
  roughness: 0.5,
  metalness: 0.0,
  transparent: true,
  opacity: 1.0,
  alphaTest: 0.5, // 境界をはっきりさせて枠線感を消す
});

material.onBeforeCompile = (shader) => {
  shader.uniforms.uBendAmount = { value: params.bendAmount };
  shader.vertexShader = shader.vertexShader.replace(
    '#include <common>',
    `#include <common>
    attribute float aAngle;
    attribute float aZRotation;
    uniform float uBendAmount;`
  );

  shader.vertexShader = shader.vertexShader.replace(
    '#include <beginnormal_vertex>',
    `#include <beginnormal_vertex>
    {
      float ang = aAngle;
      float ca = cos(ang);
      float sa = sin(ang);
      // Y軸回転
      float nx = objectNormal.x * ca + objectNormal.z * sa;
      float nz = -objectNormal.x * sa + objectNormal.z * ca;
      objectNormal.x = nx;
      objectNormal.z = nz;

      // 曲げ補正 (右端が固定なので position.x は負の値。0に向かって曲がるようにクランプ)
      float xN = clamp(-position.x / ${PANEL_W.toFixed(4)}, 0.0, 1.0);
      float bendAng = ang * xN * uBendAmount;
      float cb = cos(bendAng);
      float sb = sin(bendAng);
      float bnx = objectNormal.x * cb + objectNormal.z * sb;
      float bnz = -objectNormal.x * sb + objectNormal.z * cb;
      objectNormal.x = bnx;
      objectNormal.z = bnz;

      float cz = cos(aZRotation);
      float sz = sin(aZRotation);
      float rnx = objectNormal.x * cz - objectNormal.y * sz;
      float rny = objectNormal.x * sz + objectNormal.y * cz;
      objectNormal.x = rnx;
      objectNormal.y = rny;
    }`
  );

  shader.vertexShader = shader.vertexShader.replace(
    '#include <begin_vertex>',
    `#include <begin_vertex>
    {
      float ang = aAngle;
      float ca = cos(ang);
      float sa = sin(ang);
      transformed.x = position.x * ca + position.z * sa;
      transformed.z = -position.x * sa + position.z * ca;

      float xN = clamp(-position.x / ${PANEL_W.toFixed(4)}, 0.0, 1.0);
      float bendAng = ang * xN * uBendAmount;
      float cb = cos(bendAng);
      float sb = sin(bendAng);
      float bx = transformed.x * cb + transformed.z * sb;
      float bz = -transformed.x * sb + transformed.z * cb;
      transformed.x = bx;
      transformed.z = bz;

      float cz = cos(aZRotation);
      float sz = sin(aZRotation);
      float rx = transformed.x * cz - transformed.y * sz;
      float ry = transformed.x * sz + transformed.y * cz;
      transformed.x = rx;
      transformed.y = ry;
    }`
  );
  material.userData.shader = shader;
};

function updateBendUniform() {
  if (material.userData.shader) {
    material.userData.shader.uniforms.uBendAmount.value = params.bendAmount;
  }
}

// グローバルデータ
let instancedMesh;
let papers = [];
let angleArray, angleAttr;
let totalInstances = 0;

async function initPapers() {
  const response = await fetch('b.svg');
  const svgText = await response.text();
  const parser = new DOMParser();
  const svgDoc = parser.parseFromString(svgText, 'image/svg+xml');
  const rects = svgDoc.querySelectorAll('rect');
  
  totalInstances = rects.length;
  instancedMesh = new THREE.InstancedMesh(geometry, material, totalInstances);
  instancedMesh.castShadow = true;
  instancedMesh.receiveShadow = true;
  scene.add(instancedMesh);

  angleArray = new Float32Array(totalInstances);
  const zRotArray = new Float32Array(totalInstances);
  const dummy = new THREE.Object3D();
  const tmpColor = new THREE.Color();

  const palettes = [
    { h: 0.00, s: 0.95, l: 0.55 }, // 鮮やかな赤
    { h: 0.08, s: 1.00, l: 0.55 }, // 鮮やかなオレンジ
    { h: 0.15, s: 1.00, l: 0.50 }, // 鮮やかな黄色
    { h: 0.35, s: 0.90, l: 0.50 }, // 鮮やかな緑
    { h: 0.50, s: 1.00, l: 0.50 }, // 鮮やかなシアン
    { h: 0.62, s: 0.95, l: 0.60 }, // 鮮やかな青
    { h: 0.78, s: 0.90, l: 0.55 }, // 鮮やかな紫
    { h: 0.90, s: 0.95, l: 0.55 }, // 鮮やかなピンク
  ];

  rects.forEach((rect, i) => {
    const svgX = parseFloat(rect.getAttribute('x'));
    const svgY = parseFloat(rect.getAttribute('y'));
    
    // 重なりを許容するためスケールを縮小 (0.12 -> 0.04)
    const px = (svgX - 571) * 0.04;
    const py = -(svgY - 288) * 0.04;
    const pz = (Math.random() - 0.5) * 1.5;

    const zRot = (svgY / 576 - 0.5) * (Math.PI / 3);
    zRotArray[i] = zRot;

    // パレットから色を選択して適用 (i % length でバラバラに)
    const p = palettes[i % palettes.length];
    tmpColor.setHSL(p.h, p.s, p.l);
    instancedMesh.setColorAt(i, tmpColor);

    const initialAngle = params.baseAngle + (Math.random() - 0.5) * 0.1;
    angleArray[i] = initialAngle;

    papers.push({
      position: new THREE.Vector3(px, py, pz),
      angle: initialAngle, angularVelocity: 0,
      wind: 0, directWind: 0,
      // 各インスタンスの色を保持
      color: { h: p.h, s: p.s, l: p.l }
    });

    dummy.position.set(px, py, pz);
    dummy.updateMatrix();
    instancedMesh.setMatrixAt(i, dummy.matrix);
  });

  angleAttr = new THREE.InstancedBufferAttribute(angleArray, 1);
  instancedMesh.geometry.setAttribute('aAngle', angleAttr);
  instancedMesh.geometry.setAttribute('aZRotation', new THREE.InstancedBufferAttribute(zRotArray, 1));
  
  instancedMesh.instanceMatrix.needsUpdate = true;
  instancedMesh.instanceColor.needsUpdate = true;

  animate();
}

/* ===== 浮遊パーティクル ===== */
const DUST = 250;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST * 3);
const dustVel = new Float32Array(DUST * 3);
for (let i = 0; i < DUST; i++) {
  dustPos[i*3] = (Math.random()-0.5)*32; dustPos[i*3+1] = (Math.random()-0.5)*32; dustPos[i*3+2] = (Math.random()-0.5)*8;
  dustVel[i*3] = (Math.random()-0.5)*0.02; dustVel[i*3+1] = (Math.random()-0.5)*0.02; dustVel[i*3+2] = (Math.random()-0.5)*0.005;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({ color: '#e0f0ff', size: 0.05, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false });
scene.add(new THREE.Points(dustGeo, dustMat));

/* ===== マウス・風 ===== */
const mouseNDC = new THREE.Vector2(9999, 9999);
const raycaster = new THREE.Raycaster();
const intersectPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const mouseWorld = new THREE.Vector3();
const prevMouseWorld = new THREE.Vector3();
let mouseInited = false, mouseActive = false, hintHidden = false;

function onPointerMove(x, y) {
  mouseNDC.x = (x / window.innerWidth) * 2 - 1;
  mouseNDC.y = -(y / window.innerHeight) * 2 + 1;
  mouseActive = true;
  if (!hintHidden) { document.getElementById('hint').style.opacity = '0'; hintHidden = true; }
}
window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
window.addEventListener('touchstart', (e) => onPointerMove(e.touches[0].clientX, e.touches[0].clientY));
window.addEventListener('touchmove', (e) => { e.preventDefault(); onPointerMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
window.addEventListener('mouseleave', () => { mouseActive = false; });
window.addEventListener('touchend', () => { mouseActive = false; });
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ===== アニメーションループ ===== */
const clock = new THREE.Clock();
let elapsed = 0;
const tmpCol = new THREE.Color();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.04);
  elapsed += dt;

  updateBendUniform();

  if (mouseActive) {
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    intersectPlane.setFromNormalAndCoplanarPoint(camDir.negate(), new THREE.Vector3(0, 0, 0));
    raycaster.setFromCamera(mouseNDC, camera);
    const hit = raycaster.ray.intersectPlane(intersectPlane, mouseWorld);
    if (hit) {
      if (mouseInited) {
        const speedX = Math.max(-60, Math.min(60, (mouseWorld.x - prevMouseWorld.x) / Math.max(dt, 0.001)));
        const speedY = Math.max(-60, Math.min(60, (mouseWorld.y - prevMouseWorld.y) / Math.max(dt, 0.001)));
        const radius = params.windRadius;
        for (const p of papers) {
          const dist = p.position.distanceTo(mouseWorld);
          if (dist < radius) {
            const att = Math.pow(1 - dist / radius, 1.5);
            p.directWind += (speedX * 0.12 + speedY * 0.025) * att;
          }
        }
      }
      prevMouseWorld.copy(mouseWorld);
      mouseInited = true;
      mouseLight.position.set(mouseWorld.x, mouseWorld.y, 4);
      mouseLight.intensity = 1.2;
    }
  } else { mouseLight.intensity *= 0.92; }

  for (const p of papers) {
    p.directWind += (Math.sin(elapsed * 0.6 + p.position.x * 0.35 + p.position.y * 0.22) * 0.006 + Math.sin(elapsed * 1.1 + p.position.x * 0.18 - p.position.y * 0.4) * 0.003) * dt;
  }

  const tempWinds = papers.map(p => p.wind + p.directWind);
  papers.forEach(p => p.directWind = 0);

  const propRate = params.propagation, decay = params.windDecay;
  for (let i = 0; i < totalInstances; i++) {
    let nSum = 0, nCnt = 0;
    for (let j = 0; j < totalInstances; j++) {
      if (i === j) continue;
      const d2 = papers[i].position.distanceToSquared(papers[j].position);
      if (d2 < 16) {
        const weight = 1 - Math.sqrt(d2) / 4;
        nSum += tempWinds[j] * weight; nCnt += weight;
      }
    }
    papers[i].wind = (tempWinds[i] * (1 - propRate) + (nCnt > 0 ? nSum / nCnt : 0) * propRate) * decay;
  }

  const stiff = params.stiffness, damp = params.damping, wScale = params.windScale, baseAng = params.baseAngle;
  for (let i = 0; i < totalInstances; i++) {
    const p = papers[i];
    p.angularVelocity += (-stiff * (p.angle - baseAng) - damp * p.angularVelocity + p.wind * wScale) * dt;
    // 角度制限 (左向きなので baseAng を中心に制限)
    p.angle = Math.max(baseAng - 2.6, Math.min(baseAng + 2.6, p.angle + p.angularVelocity * dt));
    angleArray[i] = p.angle;

    const wi = Math.min(Math.abs(p.wind) * 5, 1);
    // 保持している色をベースに、風でわずかに発光感を出す
    tmpCol.setHSL(p.color.h, p.color.s, Math.min(p.color.l + wi * 0.15, 1.0)); 
    instancedMesh.setColorAt(i, tmpCol);
  }
  angleAttr.needsUpdate = true;
  instancedMesh.instanceColor.needsUpdate = true;

  const dp = dustGeo.attributes.position.array;
  for (let i = 0; i < DUST; i++) {
    const i3 = i * 3;
    dp[i3] += dustVel[i3] + Math.sin(elapsed * 0.3 + i) * 0.002;
    dp[i3+1] += dustVel[i3+1] + Math.cos(elapsed * 0.25 + i * 0.7) * 0.0015;
    dp[i3+2] += dustVel[i3+2];
    if (Math.abs(dp[i3]) > 16) dp[i3] *= -0.5;
    if (Math.abs(dp[i3+1]) > 16) dp[i3+1] *= -0.5;
    if (Math.abs(dp[i3+2]) > 5) dp[i3+2] *= -0.5;
  }
  dustGeo.attributes.position.needsUpdate = true;
  controls.update();
  renderer.render(scene, camera);
}

initPapers();
</script>
</body>
</html>
