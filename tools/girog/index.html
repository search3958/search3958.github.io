<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記録メモ</title>
<meta name="description" content="記録をカード形式で整理できるシンプルな記録メモ管理画面。">
<link rel="icon" type="image/png" href="https://search3958.github.io/project/logos/girog_main.svg">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6151036058675874"
     crossorigin="anonymous"></script>

<!-- アイコン・フォント -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<!-- 既存のM3カラーテーマ -->
<link rel="stylesheet" href="../m3color.css">

<!-- 0F8 アカウントクライアント -->
<script src="https://search3958.github.io/frameworks/client-service.js"></script>
<script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>
  <script type="module">
    import '@material/web/all.js';
    import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';

    document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
  </script>

<style>
  /* 余白リセットは自前の要素だけに限定する（md-* 要素や md-dialog の UA 既定の margin:auto を壊さないため） */
  *, *::before, *::after { box-sizing: border-box; }
  /* ダイアログ内のMaterial Webスロット要素には、全体リセットを適用しない */
  :is(html, body, div, section, header, main, article, p, form, textarea, input, button, span, ul, li, h3):not(md-dialog *) {
    margin: 0;
    padding: 0;
  }
  [hidden] { display: none !important; }

  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--md-sys-color-surface);
    color: var(--md-sys-color-on-surface);
  }
  button, input, textarea { font: inherit; color: inherit; }
  md-icon { font-family: 'Material Symbols Outlined'; }

  /* ---------- 一覧 ---------- */
  .list-view { height: 100%; overflow: auto; }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; min-height: 72px;
    background: var(--md-sys-color-surface);
  }
  .title { font-size: 24px; font-weight: 500; white-space: nowrap; padding-right: 8px; }
  .search {
    flex: 1; max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
    height: 48px; padding: 0 16px; border-radius: 24px;
    background: var(--md-sys-color-surface-container-high);
  }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px;
  }
  .right-actions { display: flex; align-items: center; gap: 8px; }
  .logged-area { display: flex; align-items: center; gap: 8px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; overflow: hidden; cursor: pointer;
    background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container);
    font-weight: 500; display: flex; align-items: center; justify-content: center;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .anchor-wrap { position: relative; }

  .content { padding: 8px 28px 48px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px; max-width: 1280px; margin: 0 auto;
  }
  .card {
    display: flex; flex-direction: column; gap: 12px;
    min-height: 200px; max-height: 320px; overflow: hidden; padding: 22px;
    border-radius: 48px; cursor: pointer;
    corner-shape: superellipse(1.5);
    background: var(--theme-white, #fff);
    border: 1px solid var(--md-sys-color-outline-variant);
    transition: box-shadow 0.2s;
  }
  .card:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
  .card-title { font-size: 18px; font-weight: 600; line-height: 1.3; word-break: break-word; }
  .card-body {
    font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    color: var(--md-sys-color-on-surface-variant);
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-date { margin-top: auto; font-size: 13px; color: var(--md-sys-color-on-surface-variant); }
  .empty { grid-column: 1 / -1; text-align: center; padding: 96px 16px; color: var(--md-sys-color-on-surface-variant); font-size: 16px; }
  .listing-ad {
    display: block;
    width: 100%;
    min-width: 0;
    margin: 4px auto;
    overflow: hidden;
  }

  /* ---------- 全画面ビュー（編集・ゴミ箱） ---------- */
  .fullview {
    position: fixed; inset: 0; z-index: 100; display: none; flex-direction: column;
    background: var(--md-sys-color-surface);
  }
  .fullview.active { display: flex; }
  .fullview-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    height: 72px; padding: 0 16px; border-bottom: 1px solid var(--md-sys-color-outline-variant);
    flex-shrink: 0;
  }
  .fullview-bar .group { display: flex; align-items: center; gap: 8px; }
  .fullview-scroll {
    flex: 1;
    min-height: 0;
    overflow: auto;
    overflow-anchor: none;
    scroll-behavior: auto;
  }

  .editor-content { width: min(980px, calc(100% - 48px)); margin: 0 auto; padding: 56px 0 120px; }
  .editor-title, .editor-body {
    display: block;
    width: 100%; border: 0; outline: 0; resize: none; background: transparent;
    overflow-anchor: none;
  }
  .editor-title {
    font-size: clamp(32px, 4.5vw, 52px); line-height: 1.15; font-weight: 600;
    margin-bottom: 28px; overflow: hidden;
  }
  /* 本文欄は固定高にして、入力ごとの自動伸長による親スクロールのずれを防ぐ */
  .editor-body {
    font-size: 18px;
    line-height: 1.85;
    height: 60vh;
    min-height: 240px;
    max-height: calc(100vh - 180px);
    overflow: auto;
    overscroll-behavior: contain;
  }
  .editor-title::placeholder, .editor-body::placeholder, .search input::placeholder {
    color: var(--md-sys-color-on-surface-variant);
  }
  .editor-status { margin-top: 20px; font-size: 13px; color: var(--md-sys-color-on-surface-variant); }

  .trash-content { width: min(900px, calc(100% - 40px)); margin: 0 auto; padding: 24px 0 64px; }
  .trash-list { display: flex; flex-direction: column; gap: 10px; }
  .trash-item {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 16px 20px; border-radius: 20px;
    background: var(--md-sys-color-surface-container-low);
    border: 1px solid var(--md-sys-color-outline-variant);
  }
  .trash-text { min-width: 0; overflow: hidden; }
  .trash-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trash-body {
    font-size: 13px; color: var(--md-sys-color-on-surface-variant);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
  }
  .trash-item-actions { display: flex; gap: 8px; flex: 0 0 auto; }

  /* ---------- スナックバー ---------- */
  .snackbar {
    position: fixed; left: 50%; bottom: 24px; z-index: 300;
    display: flex; align-items: center; gap: 16px;
    min-width: 260px; max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 12px;
    background: var(--md-sys-color-inverse-surface); color: var(--md-sys-color-inverse-on-surface);
    box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    transform: translate(-50%, calc(100% + 40px)); opacity: 0; pointer-events: none;
    transition: transform 0.22s ease, opacity 0.22s ease;
  }
  .snackbar.active { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  .snackbar button {
    border: 0; background: transparent; cursor: pointer; font-weight: 600;
    color: var(--md-sys-color-inverse-primary); padding: 6px 8px;
  }

  .busy {
    position: fixed; inset: 0; z-index: 3000; display: flex; align-items: center; justify-content: center;
    background: #fff7;
  }

  .dl-tools { display: flex; gap: 8px; flex-wrap: wrap; padding-bottom: 8px; }
  .supporting { font-size: 12px; }
  .ask-text { margin: 0; }
  #cloudList .cloud-note-row { cursor: pointer; }
  #cloudList .cloud-native-checkbox {
    appearance: auto; -webkit-appearance: checkbox;
    width: 20px; height: 20px; min-width: 20px; margin: 0 16px 0 4px;
    padding: 0; accent-color: var(--md-sys-color-primary, #6750a4);
    cursor: pointer; flex: 0 0 auto;
  }
  #cloudList .cloud-note-row.is-selected { background: var(--md-sys-color-secondary-container); }
  #cloudList .cloud-note-row.is-existing { opacity: .7; }
  #cloudList .cloud-note-copy { min-width: 0; }

  /* ダイアログ：幅の下限と内側の余白を確保 */
  md-dialog:not([fullscreen]) { min-width: 280px; max-width: 560px; }
  md-dialog [slot="actions"] { gap: 8px; }

  @media (max-width: 600px) {
    .topbar { padding: 10px 12px; }
    .title { display: none; }
    .content { padding: 8px 14px 40px; }
    .editor-content { width: calc(100% - 32px); padding-top: 32px; }
    .fullview-bar { padding: 0 8px; }
    .right-actions { gap: 4px; }
    .editor-body { height: 58vh; max-height: calc(100dvh - 160px); }
  }
</style>
</head>
<body>

<!-- ================= 一覧画面 ================= -->
<section class="list-view" id="listView">
  <header class="topbar">
    <div class="title">記録メモ</div>

    <div class="search">
      <md-icon>search</md-icon>
      <input type="search" id="searchInput" placeholder="検索..." autocomplete="off" aria-label="記録メモを検索">
    </div>

    <div class="right-actions">
      <md-filled-tonal-icon-button id="trashOpenBtn" aria-label="ゴミ箱"><md-icon>delete</md-icon></md-filled-tonal-icon-button>

      <!-- 未ログイン -->
      <md-filled-tonal-button id="loginBtn" hidden>
        <md-icon slot="icon">login</md-icon>ログイン
      </md-filled-tonal-button>

      <!-- ログイン中 -->
      <div id="loggedArea" class="logged-area" hidden>
        <div class="anchor-wrap">
          <md-filled-tonal-icon-button id="syncBtn" aria-label="同期"><md-icon>sync</md-icon></md-filled-tonal-icon-button>
          <md-menu id="syncMenu" anchor="syncBtn" positioning="popover">
            <md-menu-item id="syncUp">
              <div slot="headline">アップロード（この端末の内容で上書き）</div>
              <md-icon slot="start">cloud_upload</md-icon>
            </md-menu-item>
            <md-menu-item id="syncDown">
              <div slot="headline">ダウンロード（選んで追加）</div>
              <md-icon slot="start">cloud_download</md-icon>
            </md-menu-item>
          </md-menu>
        </div>
      <md-filled-button id="addBtn">新規記録メモ</md-filled-button>

        <div class="anchor-wrap">
          <button class="avatar" id="accountBtn" aria-label="アカウント"></button>
          <md-menu id="accMenu" anchor="accountBtn" positioning="popover">
            <md-menu-item disabled id="accName"><div slot="headline"></div></md-menu-item>
            <md-menu-item href="https://search3958.github.io/accounts/index.html" target="_blank" id="accManage">
              <div slot="headline">アカウント管理</div>
              <md-icon slot="start">manage_accounts</md-icon>
            </md-menu-item>
            <md-menu-item id="accLogout">
              <div slot="headline">ログアウト</div>
              <md-icon slot="start">logout</md-icon>
            </md-menu-item>
          </md-menu>
        </div>
      </div>

    </div>
  </header>

  <main class="content">
    <div class="grid" id="grid" aria-live="polite"></div>
  </main>
</section>

<!-- ================= 編集画面（全画面） ================= -->
<section class="fullview" id="editorView" aria-hidden="true">
  <header class="fullview-bar">
    <div class="group">
      <md-icon-button id="editorBackBtn" aria-label="一覧へ戻る"><md-icon>arrow_back</md-icon></md-icon-button>
    </div>
    <div class="group">
      <md-text-button id="downloadBtn"><md-icon slot="icon">download</md-icon>ダウンロード</md-text-button>
      <md-text-button id="trashNoteBtn"><md-icon slot="icon">delete</md-icon>ゴミ箱へ</md-text-button>
      <md-filled-button id="saveBtn">保存</md-filled-button>
    </div>
  </header>

  <div class="fullview-scroll" id="editorScroll">
    <div class="editor-content">
      <textarea class="editor-title" id="editorTitle" rows="1" placeholder="タイトル"></textarea>
      <textarea class="editor-body" id="editorBody" placeholder="メモの内容を入力..."></textarea>
      <div class="editor-status" id="editorStatus"></div>
    </div>
  </div>
</section>

<!-- ================= ゴミ箱（全画面） ================= -->
<section class="fullview" id="trashView" aria-hidden="true">
  <header class="fullview-bar">
    <div class="group">
      <md-icon-button id="trashBackBtn" aria-label="閉じる"><md-icon>arrow_back</md-icon></md-icon-button>
      <span style="font-size:18px;font-weight:500;">ゴミ箱</span>
    </div>
    <div class="group">
      <md-text-button id="restoreAllBtn">全て復元</md-text-button>
      <md-text-button id="emptyTrashBtn">全て削除</md-text-button>
    </div>
  </header>
  <div class="fullview-scroll">
    <div class="trash-content">
      <div class="trash-list" id="trashList"></div>
    </div>
  </div>
</section>

<!-- 処理中 -->
<div class="busy" id="busy" hidden><md-circular-progress indeterminate></md-circular-progress></div>

<!-- 汎用確認 / メッセージ -->
<md-dialog id="dlgAsk">
  <div slot="headline" id="askTitle"></div>
  <form slot="content" id="formAsk" method="dialog">
    <p id="askText" class="ask-text"></p>
  </form>
  <div slot="actions">
    <md-text-button id="askCancel" form="formAsk" value="cancel">キャンセル</md-text-button>
    <md-filled-button id="askOk" form="formAsk" value="ok">OK</md-filled-button>
  </div>
</md-dialog>

<!-- クラウドからダウンロード（全画面） -->
<md-dialog id="dlDialog" fullscreen>
  <div slot="headline">クラウドからダウンロード</div>
  <div slot="content">
    <div class="dl-tools">
      <md-text-button id="dlSelectNew">この端末にない分をすべて選択</md-text-button>
      <md-text-button id="dlClear">選択解除</md-text-button>
    </div>
    <md-list id="cloudList"></md-list>
  </div>
  <div slot="actions">
    <md-text-button id="dlCancel">閉じる</md-text-button>
    <md-filled-button id="dlApply" disabled>追加</md-filled-button>
  </div>
</md-dialog>

<!-- スナックバー -->
<div class="snackbar" id="snackbar">
  <span id="snackbarMsg"></span>
  <button id="snackbarUndo" type="button" hidden>元に戻す</button>
</div>

<script>
(() => {
  "use strict";

  const OF8 = window.OF8Account;
  const STORAGE_KEY = "notes";
  // クラウド上の階層（ノード）。同じアカウント内の他アプリのデータと混ざらないようにする
  const NOTE_PREFIX = "record-memo/v1/notes/";
  const cloudKey = uid => NOTE_PREFIX + uid;

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>\'"]/g, t => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
  }[t]));
  const genId = () => `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;

  // ================= データ =================
  let notes = (() => {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      return stored ? JSON.parse(stored) : [
        { id: "1", title: "お客様を歓迎します！", content: "", isDeleted: false },
        { id: "2", title: "必ずご確認ください", content: "記録ノートへようこそ。", isDeleted: false }
      ];
    } catch (error) {
      console.error("[記録メモ] 保存データの読み込みに失敗しました。初期データを使用します。", error);
      return [
        { id: "1", title: "お客様を歓迎します！", content: "", isDeleted: false },
        { id: "2", title: "必ずご確認ください", content: "記録ノートへようこそ。", isDeleted: false }
      ];
    }
  })().map(n => {
    const id = String(n.id ?? genId());
    return {
      id,
      uid: n.uid || genId(),
      title: typeof n.title === "string" ? n.title : "",
      content: typeof n.content === "string" ? n.content : "",
      isDeleted: !!n.isDeleted,
      createdAt: Number(n.createdAt) || Date.now(),
      updatedAt: Number(n.updatedAt) || Number(n.createdAt) || Date.now()
    };
  });

  let activeId = null;
  let view = { user: null, query: "" };
  let snackUndo = null, snackTimer = null;

  function saveNotes() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      console.info(`[記録メモ] ローカル保存完了（${notes.length}件）。`);
    } catch (e) {
      console.error("[記録メモ] localStorageへの保存に失敗しました。", e);
    }
  }
  const findNote = id => notes.find(n => n.id === id);

  function formatDate(note) {
    const ts = Number(note.updatedAt || note.createdAt);
    if (!Number.isFinite(ts)) return "編集済み";
    const date = new Date(ts), now = new Date();
    if (date.toDateString() === now.toDateString()) return "今日編集済み";
    const diff = Math.floor((Date.now() - ts) / 86400000);
    if (diff === 1) return "昨日編集済み";
    if (diff >= 2 && diff < 30) return `${diff}日前に編集済み`;
    return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, "0")}/${String(date.getDate()).padStart(2, "0")} 編集済み`;
  }

  // ================= ダイアログ・処理中・スナックバー =================
  function ask({ title, text, ok = "OK", single = false }) {
    return new Promise(resolve => {
      const d = $("dlgAsk");
      if (!d) {
        console.error('[記録メモ] ダイアログ要素 "dlgAsk" が見つかりません。');
        resolve(false);
        return;
      }
      $("askTitle").textContent = title;
      $("askText").textContent = text;
      $("askOk").textContent = ok;
      $("askCancel").hidden = single;
      const onClose = () => {
        d.removeEventListener("close", onClose);
        resolve(single || d.returnValue === "ok");
      };
      d.addEventListener("close", onClose);
      d.show();
    });
  }
  const msg = (title, text) => ask({ title, text, ok: "閉じる", single: true });

  async function withBusy(fn) {
    const busy = $("busy");
    if (!busy) {
      console.error('[記録メモ] 処理中表示 "busy" が見つかりません。');
      return fn();
    }
    busy.hidden = false;
    try { return await fn(); } finally { busy.hidden = true; }
  }
  async function guard(fn, okText) {
    try {
      await withBusy(fn);
      if (okText) await msg("完了", okText);
    } catch (e) {
      console.error("[記録メモ] 操作に失敗しました。", e);
      await msg("エラー", e.message || String(e));
    }
  }

  function showSnackbar(text, undo = null) {
    $("snackbarMsg").textContent = text;
    $("snackbarUndo").hidden = !undo;
    snackUndo = undo;
    $("snackbar").classList.add("active");
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => {
      $("snackbar").classList.remove("active");
      snackUndo = null;
    }, 5000);
  }
  $("snackbarUndo").onclick = () => {
    if (snackUndo) snackUndo();
    snackUndo = null;
    $("snackbar").classList.remove("active");
    clearTimeout(snackTimer);
  };

  // 同時書き込みを直列化（OF8の競合対策）
  let opQueue = Promise.resolve();
  const serial = fn => (opQueue = opQueue.then(fn, fn));

  // ================= ログイン・アカウント =================
  async function refreshAuth() {
    let user = null;
    try {
      if (OF8 && await OF8.isLoggedIn()) {
        const info = await OF8.accountInfo();
        user = info.account;
      }
    } catch (e) {
      console.error("[記録メモ] ログイン状態の確認に失敗しました。", e);
      user = null;
    }
    view.user = user;
    renderAuth();
  }

  // ログアウト時：ログインボタン / ログイン時：アカウントアイコン（排他的に切り替え）
  function renderAuth() {
    const u = view.user;
    $("loginBtn").hidden = !!u;
    $("loggedArea").hidden = !u;
    if (!u) return;
    const btn = $("accountBtn");
    if (u.icon) {
      btn.innerHTML = `<img alt="" src="data:${esc(u.iconMimeType || "image/png")};base64,${esc(u.icon)}">`;
    } else {
      btn.textContent = (u.name || u.id || "?").slice(0, 1);
    }
    $("accName").querySelector("[slot=headline]").textContent = u.name || u.id;
  }

  $("loginBtn").onclick = async () => {
    try {
      if (!OF8 || typeof OF8.login !== "function") throw new Error("アカウントサービスを読み込めませんでした。");
      await withBusy(() => OF8.login());
      await refreshAuth();
    } catch (e) {
      console.error("[記録メモ] ログインに失敗しました。", e);
      await msg("ログインできませんでした", e.message);
    }
  };
  $("accountBtn").onclick = () => { $("accMenu").open = !$("accMenu").open; };
  $("syncBtn").onclick = () => { $("syncMenu").open = !$("syncMenu").open; };
  $("accLogout").onclick = () => guard(async () => {
    if (!OF8 || typeof OF8.logout !== "function") throw new Error("アカウントサービスを読み込めませんでした。");
    await OF8.logout();
    await refreshAuth();
  });

  // ================= 同期：アップロード（強制上書き） =================
  async function uploadAll() {
    if (!OF8 || typeof OF8.sync !== "function") throw new Error("アカウント同期サービスを利用できません。");
    const { items } = await OF8.sync();
    const localKeys = new Set(notes.map(n => cloudKey(n.uid)));
    // このアプリの階層のうち、端末に無いものはクラウドから削除
    for (const k of Object.keys(items || {})) {
      if (k.startsWith(NOTE_PREFIX) && !localKeys.has(k)) {
        await serial(() => OF8.removeItem(k));
      }
    }
    // 端末の内容を書き込み（ゴミ箱も含む）
    for (const n of notes) {
      const value = JSON.stringify({
        uid: n.uid, title: n.title, content: n.content, isDeleted: n.isDeleted,
        createdAt: n.createdAt, updatedAt: n.updatedAt
      });
      await serial(() => OF8.setItem(cloudKey(n.uid), value));
    }
    console.info(`[記録メモ] クラウドへのアップロード完了（${notes.length}件）。`);
  }

  $("syncUp").onclick = async () => {
    const ok = await ask({
      title: "クラウドを上書きしますか？",
      text: "この端末のメモ（ゴミ箱を含む）でクラウドの内容を置き換えます。クラウド側にだけあるメモは削除されます。この操作は取り消せません。",
      ok: "アップロード"
    });
    if (!ok) return;
    await guard(uploadAll, "アップロードしました。");
  };

  // ================= 同期：ダウンロード（選択して追加） =================
  async function fetchCloudNotes() {
    if (!OF8 || typeof OF8.sync !== "function") throw new Error("アカウント同期サービスを利用できません。");
    const { items } = await OF8.sync();
    const result = Object.entries(items || {})
      .filter(([k]) => k.startsWith(NOTE_PREFIX))
      .map(([, v]) => {
        try {
          const o = JSON.parse(v);
          return o && typeof o.uid === "string" && o.uid ? o : null;
        } catch (error) {
          console.warn("[記録メモ] クラウドのメモ1件を解析できませんでした。", error);
          return null;
        }
      })
      .filter(Boolean);
    console.info(`[記録メモ] クラウドから${result.length}件を読み込みました。`);
    return result;
  }

  let dlMap = new Map();

  $("syncDown").onclick = async () => {
    let cloud;
    try {
      cloud = await withBusy(fetchCloudNotes);
    } catch (e) {
      console.error("[記録メモ] クラウドの読み込みに失敗しました。", e);
      return msg("エラー", e.message);
    }
    const localUids = new Set(notes.map(n => n.uid));
    // この端末に無いものを上に、その中は新しい順
    cloud.sort((a, b) => {
      const la = localUids.has(a.uid), lb = localUids.has(b.uid);
      if (la !== lb) return la ? 1 : -1;
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    });
    dlMap = new Map(cloud.map(n => [n.uid, n]));
    renderCloudList(cloud, localUids);
    $("dlDialog").show();
  };

  function renderCloudList(list, localUids) {
    const el = $("cloudList");
    if (!el) {
      console.error('[記録メモ] ダウンロード一覧 "cloudList" が見つかりません。');
      return;
    }
    el.replaceChildren();

    if (!list.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "クラウドにメモがありません";
      el.appendChild(empty);
      updateDlCount();
      console.info("[記録メモ] ダウンロード一覧は空です。");
      return;
    }

    list.forEach(n => {
      const exists = localUids.has(n.uid);
      const item = document.createElement("md-list-item");
      item.className = `cloud-note-row${exists ? " is-existing" : ""}`;
      item.dataset.uid = n.uid;

      // Material Web の md-checkbox はダイアログ内でクリック／状態反映が不安定な場合があるため、
      // ネイティブ checkbox を使用し、選択状態を DOM の checked プロパティで一元管理する。
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "cloud-native-checkbox";
      checkbox.slot = "start";
      checkbox.dataset.uid = n.uid;
      checkbox.checked = false;
      checkbox.disabled = exists;
      checkbox.setAttribute("aria-label", `${n.title || "無題の記録メモ"}を選択`);
      checkbox.addEventListener("change", () => {
        item.classList.toggle("is-selected", checkbox.checked);
        updateDlCount();
      });

      const copy = document.createElement("div");
      copy.className = "cloud-note-copy";
      copy.slot = "headline";
      const headline = document.createElement("div");
      headline.textContent = `${n.title || "無題の記録メモ"}${n.isDeleted ? "（ゴミ箱）" : ""}`;
      const supporting = document.createElement("div");
      supporting.slot = "supporting-text";
      supporting.className = "supporting";
      supporting.textContent = `${(n.content || "").slice(0, 80)}${exists ? "　※この端末にあり" : ""}`;
      copy.append(headline, supporting);
      item.append(checkbox, copy);

      item.addEventListener("click", event => {
        if (checkbox.disabled || event.composedPath().includes(checkbox)) return;
        checkbox.checked = !checkbox.checked;
        checkbox.dispatchEvent(new Event("change", { bubbles: true }));
      });
      item.addEventListener("keydown", event => {
        if (event.key !== "Enter" && event.key !== " ") return;
        if (event.target === item) {
          event.preventDefault();
          if (!checkbox.disabled) {
            checkbox.checked = !checkbox.checked;
            checkbox.dispatchEvent(new Event("change", { bubbles: true }));
          }
        }
      });
      item.tabIndex = 0;
      el.appendChild(item);
    });
    updateDlCount();
    console.info(`[記録メモ] ダウンロード一覧を表示しました（${list.length}件）。`);
  }

  function getSelectedCloudNotes() {
    const el = $("cloudList");
    if (!el) {
      console.error('[記録メモ] ダウンロード一覧 "cloudList" が見つかりません。');
      return [];
    }
    return [...el.querySelectorAll('input.cloud-native-checkbox[type="checkbox"]')]
      .filter(checkbox => checkbox.checked && !checkbox.disabled)
      .map(checkbox => dlMap.get(checkbox.dataset.uid))
      .filter(Boolean);
  }

  function updateDlCount() {
    const selectedCount = getSelectedCloudNotes().length;
    const applyButton = $("dlApply");
    if (!applyButton) {
      console.error('[記録メモ] 追加ボタン "dlApply" が見つかりません。');
      return;
    }
    applyButton.textContent = selectedCount ? `追加（${selectedCount}件）` : "追加";
    applyButton.disabled = selectedCount === 0;
  }

  $("cloudList").addEventListener("change", updateDlCount);
  $("dlSelectNew").onclick = () => {
    const el = $("cloudList");
    if (!el) {
      console.error('[記録メモ] ダウンロード一覧 "cloudList" が見つかりません。');
      return;
    }
    const checkboxes = el.querySelectorAll('input.cloud-native-checkbox[type="checkbox"]');
    let selected = 0;
    checkboxes.forEach(checkbox => {
      checkbox.checked = !checkbox.disabled;
      checkbox.closest("md-list-item")?.classList.toggle("is-selected", checkbox.checked);
      if (checkbox.checked) selected++;
    });
    updateDlCount();
    console.info(`[記録メモ] この端末にないメモを選択しました（${selected}件）。`);
  };
  $("dlClear").onclick = () => {
    const el = $("cloudList");
    if (!el) {
      console.error('[記録メモ] ダウンロード一覧 "cloudList" が見つかりません。');
      return;
    }
    el.querySelectorAll('input.cloud-native-checkbox[type="checkbox"]').forEach(checkbox => {
      checkbox.checked = false;
      checkbox.closest("md-list-item")?.classList.remove("is-selected");
    });
    updateDlCount();
    console.info("[記録メモ] ダウンロード選択を解除しました。");
  };
  $("dlCancel").onclick = () => $("dlDialog").close();
  $("dlApply").onclick = async () => {
    const picked = getSelectedCloudNotes();
    if (!picked.length) {
      console.warn("[記録メモ] 追加するメモが選択されていません。");
      return;
    }

    let addedCount = 0;
    let updatedCount = 0;
    picked.forEach(n => {
      const existing = notes.find(note => note.uid === n.uid);
      const cloudNote = {
        id: existing ? existing.id : n.uid,
        uid: n.uid,
        title: typeof n.title === "string" ? n.title : "",
        content: typeof n.content === "string" ? n.content : "",
        isDeleted: !!n.isDeleted,
        createdAt: Number(n.createdAt) || Date.now(),
        updatedAt: Number(n.updatedAt) || Date.now()
      };
      if (existing) {
        Object.assign(existing, cloudNote);
        updatedCount++;
      } else {
        notes.unshift(cloudNote);
        addedCount++;
      }
    });
    saveNotes();
    $("dlDialog").close();
    renderNotes();
    const summary = [];
    if (addedCount) summary.push(`${addedCount}件を追加`);
    if (updatedCount) summary.push(`${updatedCount}件を更新`);
    showSnackbar(`${summary.join("、")}しました。`);
    console.info(`[記録メモ] クラウドから${addedCount}件を追加、${updatedCount}件を更新しました。`);
  };

  // ================= 一覧広告 =================
  const ADSENSE_CLIENT = "ca-pub-6151036058675874";
  const ADSENSE_SLOT = "3412126734";

  function createListingAd() {
    const ad = document.createElement("ins");
    ad.className = "adsbygoogle listing-ad";
    ad.style.display = "block";
    ad.setAttribute("data-ad-client", ADSENSE_CLIENT);
    ad.setAttribute("data-ad-slot", ADSENSE_SLOT);
    ad.setAttribute("data-ad-format", "auto");
    ad.setAttribute("style", "display:inline-block;width:260px;height:200px");
    return ad;
  }

  function requestListingAd(ad) {
    if (!(ad instanceof HTMLElement) || !ad.isConnected) {
      console.error("[記録メモ] 広告要素が一覧に配置されていません。");
      return;
    }
    try {
      // adsbygoogle.js は head で一度だけ読み込み、広告ごとに表示要求を追加する。
      (window.adsbygoogle = window.adsbygoogle || []).push({});
      console.info("[記録メモ] 一覧広告をリクエストしました。");
    } catch (error) {
      console.error("[記録メモ] 一覧広告のリクエストに失敗しました。", error);
    }
  }

  // ================= 一覧 =================
  function renderNotes() {
    const grid = $("grid");
    if (!grid) {
      console.error('[記録メモ] 一覧要素 "grid" が見つかりません。');
      return;
    }

    const q = view.query;
    const list = notes.filter(n => !n.isDeleted &&
      (!q || `${n.title}\n${n.content}`.toLowerCase().includes(q)));

    grid.innerHTML = "";
    if (!list.length) {
      grid.innerHTML = `<div class="empty">${q ? "一致する記録メモがありません。" : "まだ記録メモがありません。"}</div>`;
      console.info("[記録メモ] 一覧を更新しました（0件）。");
      return;
    }

    const frag = document.createDocumentFragment();
    const adElements = [];
    list.forEach((note, index) => {
      const card = document.createElement("article");
      card.className = "card";
      card.tabIndex = 0;
      card.innerHTML = `
        <div class="card-title">${esc(note.title || "無題の記録メモ")}</div>
        ${note.content ? `<div class="card-body">${esc(note.content)}</div>` : ""}
        <div class="card-date">${esc(formatDate(note))}</div>`;
      card.addEventListener("click", () => openEditor(note.id));
      card.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEditor(note.id); }
      });
      frag.appendChild(card);

      // 表示中のメモ5件ごとに広告を追加。検索後もフィルター済み件数で判定する。
      if ((index + 1) % 5 === 0) {
        const ad = createListingAd();
        frag.appendChild(ad);
        adElements.push(ad);
      }
    });

    grid.appendChild(frag);
    adElements.forEach(requestListingAd);
    console.info(`[記録メモ] 一覧を更新しました（メモ${list.length}件、広告${adElements.length}件）。`);
  }

  $("searchInput").addEventListener("input", e => {
    view.query = e.target.value.trim().toLowerCase();
    renderNotes();
  });

  // ================= 編集 =================
  function autoGrow(el) {
    if (!el) {
      console.error("[記録メモ] 高さ調整対象の入力欄が見つかりません。");
      return;
    }
    el.style.height = "auto";
    el.style.height = `${el.scrollHeight}px`;
  }

  function openEditor(id) {
    const note = findNote(id);
    if (!note) {
      console.error(`[記録メモ] 編集対象のメモが見つかりません（id=${id}）。`);
      return;
    }
    activeId = id;
    const titleEl = $("editorTitle");
    const bodyEl = $("editorBody");
    titleEl.value = note.title;
    bodyEl.value = note.content;
    $("editorStatus").textContent = formatDate(note);
    $("editorView").classList.add("active");
    $("editorView").setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    // 初期表示後もタイトルは内容に合わせて伸長する。親スクロール位置は入力前の値に戻す。
    requestAnimationFrame(() => autoGrow(titleEl));
    console.info(`[記録メモ] 編集画面を開きました（id=${id}）。`);
  }

  $("editorTitle").addEventListener("input", event => {
    const editorScroll = $("editorScroll");
    if (!editorScroll) {
      console.error('[記録メモ] 編集スクロール領域 "editorScroll" が見つかりません。');
      autoGrow(event.currentTarget);
      return;
    }
    const previousScrollTop = editorScroll.scrollTop;
    autoGrow(event.currentTarget);
    editorScroll.scrollTop = previousScrollTop;
  });

  function saveActive() {
    const note = findNote(activeId);
    if (!note) {
      console.error("[記録メモ] 保存対象のメモが見つかりません。");
      return false;
    }
    note.title = $("editorTitle").value.trim() || "無題の記録メモ";
    note.content = $("editorBody").value.trim();
    note.updatedAt = Date.now();
    saveNotes();
    console.info(`[記録メモ] メモを保存しました（id=${note.id}）。`);
    return true;
  }

  function closeEditor({ save = true } = {}) {
    if (save && activeId) saveActive();
    $("editorView").classList.remove("active");
    $("editorView").setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    activeId = null;
    renderNotes();
    console.info("[記録メモ] 編集画面を閉じました。");
  }

  $("addBtn").onclick = () => {
    const now = Date.now();
    const id = genId();
    notes.unshift({ id, uid: id, title: "", content: "", isDeleted: false, createdAt: now, updatedAt: now });
    saveNotes();
    openEditor(id);
  };
  $("editorBackBtn").onclick = () => closeEditor({ save: true });
  $("saveBtn").onclick = () => { if (saveActive()) closeEditor({ save: false }); };

  $("trashNoteBtn").onclick = () => {
    const note = findNote(activeId);
    if (!note) {
      console.error("[記録メモ] ゴミ箱へ移動するメモが見つかりません。");
      return;
    }
    note.isDeleted = true;
    note.updatedAt = Date.now();
    saveNotes();
    const id = note.id;
    closeEditor({ save: false });
    showSnackbar("ゴミ箱へ移動しました。", () => {
      const n = findNote(id);
      if (n) { n.isDeleted = false; n.updatedAt = Date.now(); saveNotes(); renderNotes(); }
    });
  };

  $("downloadBtn").onclick = () => {
    const title = $("editorTitle").value.trim() || "記録メモ";
    const blob = new Blob([`${title}\n\n${$("editorBody").value}`], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${title.replace(/[\\/:*?"<>|]/g, "_")}.txt`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    console.info("[記録メモ] テキストファイルのダウンロードを開始しました。");
  };

  // ================= ゴミ箱 =================
  function openTrash() {
    renderTrash();
    $("trashView").classList.add("active");
    $("trashView").setAttribute("aria-hidden", "false");
    console.info("[記録メモ] ゴミ箱を開きました。");
  }
  function closeTrash() {
    $("trashView").classList.remove("active");
    $("trashView").setAttribute("aria-hidden", "true");
    renderNotes();
    console.info("[記録メモ] ゴミ箱を閉じました。");
  }

  function renderTrash() {
    const el = $("trashList");
    if (!el) {
      console.error('[記録メモ] ゴミ箱一覧 "trashList" が見つかりません。');
      return;
    }
    const deleted = notes.filter(n => n.isDeleted);
    el.innerHTML = "";
    if (!deleted.length) {
      el.innerHTML = `<div class="empty">ゴミ箱は空です。</div>`;
      return;
    }
    deleted.forEach(note => {
      const item = document.createElement("div");
      item.className = "trash-item";
      item.innerHTML = `
        <div class="trash-text">
          <div class="trash-title">${esc(note.title || "無題の記録メモ")}</div>
          <div class="trash-body">${esc(note.content)}</div>
        </div>
        <div class="trash-item-actions">
          <md-text-button data-act="restore">復元</md-text-button>
          <md-text-button data-act="purge">完全削除</md-text-button>
        </div>`;
      const restoreButton = item.querySelector('[data-act="restore"]');
      const purgeButton = item.querySelector('[data-act="purge"]');
      if (!restoreButton || !purgeButton) {
        console.error("[記録メモ] ゴミ箱の操作ボタンを作成できませんでした。", note.id);
        return;
      }
      restoreButton.onclick = () => {
        note.isDeleted = false; note.updatedAt = Date.now();
        saveNotes(); renderTrash();
      };
      purgeButton.onclick = () => {
        notes = notes.filter(n => n.id !== note.id);
        saveNotes(); renderTrash();
        showSnackbar("完全に削除しました。");
      };
      el.appendChild(item);
    });
  }

  $("trashOpenBtn").onclick = openTrash;
  $("trashBackBtn").onclick = closeTrash;
  $("restoreAllBtn").onclick = () => {
    const count = notes.filter(n => n.isDeleted).length;
    if (!count) return;
    notes.forEach(n => { if (n.isDeleted) { n.isDeleted = false; n.updatedAt = Date.now(); } });
    saveNotes(); renderTrash();
    showSnackbar(`${count}件を復元しました。`);
  };
  $("emptyTrashBtn").onclick = async () => {
    const count = notes.filter(n => n.isDeleted).length;
    if (!count) return;
    const ok = await ask({
      title: "ゴミ箱を空にしますか？",
      text: "ゴミ箱内の記録メモを完全に削除します。この操作は取り消せません。",
      ok: "完全に削除"
    });
    if (!ok) return;
    notes = notes.filter(n => !n.isDeleted);
    saveNotes(); renderTrash();
    showSnackbar("ゴミ箱を空にしました。");
  };

  // ================= キーボード =================
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if ($("editorView").classList.contains("active")) closeEditor({ save: true });
    else if ($("trashView").classList.contains("active")) closeTrash();
  });

  // ================= 初期化 =================
  saveNotes();
  renderNotes();
  refreshAuth();
  console.info("[記録メモ] 初期化が完了しました。");
})();
</script>
