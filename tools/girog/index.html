<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記録メモ</title>
<meta name="description" content="記録をカード形式で整理できるシンプルな記録メモ管理画面。">
<link rel="icon" type="image/png" href="icon.png">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6151036058675874"
     crossorigin="anonymous"></script>

<style>
:root {
    --artifact-bg: #fafafa;
    --artifact-surface: #ffffff;
    --artifact-border: #dfdfdf;
    --artifact-border-strong: #cfcfcf;
    --artifact-text: #111111;
    --artifact-muted: #858585;
    --artifact-soft: #f3f3f3;
    --artifact-shadow: 0 10px 30px rgba(0,0,0,.045);
    --artifact-shadow-hover: 0 16px 44px rgba(0,0,0,.085);
    --artifact-radius: 48px;
    --artifact-yellow: #ffe55b;
    --artifact-max: 1360px;
    --artifact-editor-max: 980px;
    --artifact-transition: 180ms cubic-bezier(.2,.8,.2,1);
}

@media (prefers-color-scheme: dark) {
    :root {
        --artifact-bg: #111111;
        --artifact-surface: #171717;
        --artifact-border: #2b2b2b;
        --artifact-border-strong: #3a3a3a;
        --artifact-text: #f5f5f5;
        --artifact-muted: #9a9a9a;
        --artifact-soft: #202020;
        --artifact-shadow: 0 10px 30px rgba(0,0,0,.22);
        --artifact-shadow-hover: 0 16px 44px rgba(0,0,0,.34);
        --artifact-yellow: #ffe45b;
    }
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    background: var(--artifact-bg);
    color: var(--artifact-text);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
}

button,
input,
textarea {
    font: inherit;
}

button {
    color: inherit;
}

button,
.artifact-card,
.artifact-logo,
.artifact-search {
    -webkit-tap-highlight-color: transparent;
}

/* =========================
   一覧画面
========================= */
.artifact-app {
    width: 100%;
    height: 100%;
}

.artifact-list-view {
    width: 100%;
    height: 100%;
    overflow: auto;
}

.artifact-shell {
    width: min(var(--artifact-max), calc(100% - 64px));
    margin: 0 auto;
    padding: 58px 0 64px;
}

.artifact-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 28px;
    margin-bottom: 72px;
}

.artifact-brand {
    display: flex;
    align-items: center;
    min-width: 0;
}

.artifact-logo {
    display: none;
}

.artifact-heading {
    font-size: clamp(34px, 3.2vw, 48px);
    line-height: 1;
    font-weight: 650;
    letter-spacing: -0.045em;
}

.artifact-actions {
    display: flex;
    align-items: center;
    gap: 16px;
    flex: 0 0 auto;
}

.artifact-search {
    width: 54px;
    height: 54px;
    border: 1px solid var(--artifact-border);
    background: var(--artifact-surface);
    border-radius: 17px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform var(--artifact-transition), border-color var(--artifact-transition);
}

.artifact-search:hover {
    border-color: var(--artifact-border-strong);
    transform: translateY(-1px);
}

.artifact-search:active {
    transform: scale(.97);
}

.artifact-search svg {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
}

.artifact-search-field {
    width: 0;
    opacity: 0;
    pointer-events: none;
    border: 1px solid var(--artifact-border);
    background: var(--artifact-surface);
    color: var(--artifact-text);
    border-radius: 17px;
    height: 54px;
    padding: 0;
    outline: none;
    transition: width var(--artifact-transition), opacity var(--artifact-transition), padding var(--artifact-transition);
}

.artifact-search-field::placeholder {
    color: var(--artifact-muted);
}

.artifact-actions.search-open .artifact-search-field {
    width: 270px;
    opacity: 1;
    pointer-events: auto;
    padding: 0 18px;
}

.artifact-actions.search-open .artifact-search {
    display: none;
}

.artifact-add {
    min-height: 54px;
    padding: 0 24px;
    border: 0;
    border-radius: 17px;
    background: #111;
    color: #fff;
    font-size: 17px;
    font-weight: 560;
    cursor: pointer;
    letter-spacing: -0.02em;
    transition: transform var(--artifact-transition), opacity var(--artifact-transition);
}

.artifact-add:hover {
    transform: translateY(-1px);
    opacity: .94;
}

.artifact-add:active {
    transform: scale(.98);
}

.artifact-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 40px;
}

.artifact-card {
    min-width: 0;
    overflow: hidden;
    position:relative;
    border: 1px solid var(--artifact-border);
    background: var(--artifact-surface);
    border-radius: var(--artifact-radius);
    corner-shape: superellipse(1.5);
    cursor: pointer;
    box-shadow: var(--artifact-shadow);
    transition: transform var(--artifact-transition), box-shadow var(--artifact-transition), border-color var(--artifact-transition);
}

.artifact-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--artifact-shadow-hover);
    border-color: var(--artifact-border-strong);
}

.artifact-card:active {
    transform: translateY(-1px) scale(.995);
}

.artifact-preview {
    position: relative;
    height: 250px;
    overflow: hidden;
    border-bottom: 1px solid var(--artifact-border);
    background: #fff;
}

.artifact-load-more {
    grid-column: 1 / -1;
    padding: 16px 24px;
    border: 1px solid var(--artifact-border);
    background: var(--artifact-surface);
    border-radius: 16px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 500;
    color: var(--artifact-text);
    transition: transform var(--artifact-transition), border-color var(--artifact-transition);
}

.artifact-load-more:hover {
    border-color: var(--artifact-border-strong);
    transform: translateY(-1px);
}

.artifact-load-more:active {
    transform: scale(.98);
}

@media (prefers-color-scheme: dark) {
    .artifact-preview {
        background: #191919;
    }
}

.artifact-preview-inner {
    width: 100%;
    height: 100%;
    padding: 28px 26px;
    overflow: hidden;
}

.artifact-preview-title {
    display:none;
}

.artifact-preview-code,
.artifact-preview-text {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    font-size: 16px;
    line-height: 1.35;
    overflow: hidden;
}

.artifact-preview-text {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Noto Sans JP", sans-serif;
    font-size: 16px;
}

.artifact-preview-code {
    font-size: 15px;
}

.artifact-preview-empty {
    height: 100%;
    display: grid;
    place-items: center;
    color: #8f8f8f;
}

.artifact-preview-empty svg {
    width: 44px;
    height: 44px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
}

.artifact-meta {
    min-height: 132px;
    padding: 24px;
    padding-top:50px;
    position:absolute;
    bottom:0;
    left:0;
    width: 100%;
    background-image: linear-gradient(359deg, var(--artifact-surface), var(--artifact-surface), transparent);
}

.artifact-title {
    font-size: 23px;
    line-height: 1.28;
    font-weight: 570;
    letter-spacing: -0.025em;
    word-break: break-word;
}

.artifact-date {
    margin-top: 22px;
    font-size: 17px;
    color: var(--artifact-muted);
}

.artifact-empty {
    grid-column: 1 / -1;
    padding: 100px 20px;
    text-align: center;
    color: var(--artifact-muted);
    font-size: 18px;
}

/* =========================
   全画面編集画面
========================= */
.artifact-editor-view {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    background: var(--artifact-bg);
}

.artifact-editor-view.active {
    display: block;
}

.artifact-editor-bar {
    width: 100%;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 12px 28px;
    border-bottom: 1px solid var(--artifact-border);
    background: color-mix(in srgb, var(--artifact-bg) 94%, transparent);
}

.artifact-editor-left,
.artifact-editor-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.artifact-editor-icon {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 15px;
    background: transparent;
    cursor: pointer;
    transition: background var(--artifact-transition), transform var(--artifact-transition);
}

.artifact-editor-icon:hover {
    background: var(--artifact-soft);
}

.artifact-editor-icon:active {
    transform: scale(.96);
}

.artifact-editor-icon svg {
    width: 23px;
    height: 23px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.artifact-editor-save,
.artifact-editor-delete,
.artifact-editor-download {
    min-height: 48px;
    padding: 0 19px;
    border: 0;
    border-radius: 15px;
    cursor: pointer;
    transition: transform var(--artifact-transition), opacity var(--artifact-transition);
}

.artifact-editor-save {
    background: #111;
    color: #fff;
    font-weight: 600;
}

.artifact-editor-delete {
    background: #f0dfdf;
    color: #a43333;
}

.artifact-editor-download {
    background: var(--artifact-soft);
    color: var(--artifact-text);
}

.artifact-editor-save:hover,
.artifact-editor-delete:hover,
.artifact-editor-download:hover {
    transform: translateY(-1px);
}

.artifact-editor-scroll {
    height: calc(100% - 80px);
    overflow: auto;
}

.artifact-editor-content {
    width: min(var(--artifact-editor-max), calc(100% - 64px));
    min-height: 100%;
    margin: 0 auto;
    padding: 82px 0 120px;
}

.artifact-editor-title {
    width: 100%;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    color: var(--artifact-text);
    font-size: clamp(38px, 5vw, 64px);
    line-height: 1.08;
    font-weight: 650;
    letter-spacing: -0.04em;
    margin-bottom: 42px;
}

.artifact-editor-title::placeholder,
.artifact-editor-body::placeholder {
    color: var(--artifact-muted);
}

.artifact-editor-body {
    width: 100%;
    min-height: 62vh;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    color: var(--artifact-text);
    font-size: 20px;
    line-height: 1.9;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Noto Sans JP", sans-serif;
}

.artifact-editor-status {
    margin-top: 18px;
    color: var(--artifact-muted);
    font-size: 14px;
}

/* =========================
   ゴミ箱画面
========================= */
.artifact-trash-view {
    position: fixed;
    inset: 0;
    z-index: 120;
    display: none;
    background: var(--artifact-bg);
}

.artifact-trash-view.active {
    display: block;
}

.artifact-trash-scroll {
    height: 100%;
    overflow: auto;
}

.artifact-trash-shell {
    width: min(900px, calc(100% - 48px));
    margin: 0 auto;
    padding: 38px 0 64px;
}

.artifact-trash-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 32px;
}

.artifact-trash-title {
    font-size: 34px;
    font-weight: 650;
}

.artifact-trash-actions {
    display: flex;
    gap: 10px;
}

.artifact-trash-actions button {
    min-height: 46px;
    padding: 0 18px;
    border: 1px solid var(--artifact-border);
    background: var(--artifact-surface);
    border-radius: 14px;
    cursor: pointer;
}

.artifact-trash-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.artifact-trash-item {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    align-items: center;
    padding: 20px;
    border: 1px solid var(--artifact-border);
    background: var(--artifact-surface);
    border-radius: 16px;
}

.artifact-trash-item-text {
    min-width: 0;
    overflow: hidden;
}

.artifact-trash-item-title {
    font-weight: 600;
    font-size: 18px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.artifact-trash-item-body {
    margin-top: 4px;
    font-size: 14px;
    color: var(--artifact-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.artifact-trash-item-actions {
    display: flex;
    gap: 8px;
    flex: 0 0 auto;
}

.artifact-trash-item-actions button {
    border: 0;
    border-radius: 10px;
    padding: 9px 13px;
    cursor: pointer;
}

/* =========================
   スナックバー
========================= */
.artifact-snackbar {
    position: fixed;
    left: 50%;
    bottom: 24px;
    z-index: 300;
    display: flex;
    align-items: center;
    gap: 18px;
    min-width: 240px;
    max-width: calc(100% - 32px);
    padding: 13px 17px;
    border-radius: 13px;
    background: #202020;
    color: #fff;
    box-shadow: 0 16px 50px rgba(0,0,0,.25);
    transform: translate(-50%, calc(100% + 40px));
    opacity: 0;
    pointer-events: none;
    transition: transform 220ms ease, opacity 220ms ease;
}

.artifact-snackbar.active {
    transform: translate(-50%, 0);
    opacity: 1;
    pointer-events: auto;
}

.artifact-snackbar button {
    border: 0;
    background: transparent;
    color: var(--artifact-yellow);
    font-weight: 650;
    cursor: pointer;
}

@media (max-width: 1050px) {
    .artifact-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 720px) {
    .artifact-shell {
        width: calc(100% - 28px);
        padding-top: 28px;
    }

    .artifact-topbar {
        align-items: flex-start;
        margin-bottom: 40px;
    }

    .artifact-heading {
        font-size: 34px;
    }

    .artifact-actions {
        gap: 8px;
    }

    .artifact-add {
        min-height: 48px;
        padding: 0 15px;
        font-size: 15px;
    }

    .artifact-grid {
        grid-template-columns: 1fr;
        gap: 18px;
    }

    .artifact-preview {
        height: 235px;
    }

    .artifact-title {
        font-size: 21px;
    }

    .artifact-meta {
        min-height: 116px;
    }

    .artifact-editor-bar {
        height: 68px;
        padding: 10px 14px;
    }

    .artifact-editor-scroll {
        height: calc(100% - 68px);
    }

    .artifact-editor-right {
        gap: 5px;
    }

    .artifact-editor-save,
    .artifact-editor-delete,
    .artifact-editor-download {
        min-height: 44px;
        padding: 0 12px;
        font-size: 13px;
    }

    .artifact-editor-content {
        width: calc(100% - 36px);
        padding-top: 44px;
    }

    .artifact-editor-title {
        font-size: 38px;
        margin-bottom: 30px;
    }

    .artifact-editor-body {
        font-size: 18px;
        line-height: 1.8;
    }

    .artifact-trash-shell {
        width: calc(100% - 28px);
        padding-top: 24px;
    }

    .artifact-trash-top {
        align-items: flex-start;
        flex-direction: column;
    }
}

@media (max-width: 500px) {
    .artifact-search-field {
        display: none;
    }

    .artifact-actions.search-open .artifact-search-field {
        display: block;
        position: absolute;
        left: 14px;
        right: 14px;
        width: auto;
    }

    .artifact-actions.search-open {
        position: static;
    }

    .artifact-editor-delete,
    .artifact-editor-download {
        width: 44px;
        padding: 0;
        font-size: 0;
    }

    .artifact-editor-delete::before {
        content: "削除";
        font-size: 13px;
    }

    .artifact-editor-download::before {
        content: "保存";
        font-size: 13px;
    }
}
</style>
</head>

<body>
<div class="artifact-app">

    <section class="artifact-list-view" id="artifactListView">
        <div class="artifact-shell">
            <header class="artifact-topbar">
                <div class="artifact-brand">
                    <h1 class="artifact-heading">記録メモ</h1>
                </div>

                <div class="artifact-actions" id="artifactActions">
                    <input
                        class="artifact-search-field"
                        id="artifactSearchInput"
                        type="search"
                        placeholder="検索..."
                        autocomplete="off"
                        aria-label="記録メモを検索">
                    <button class="artifact-search" id="artifactSearchButton" type="button" title="検索" aria-label="検索">
                        <svg viewBox="0 0 24 24">
                            <circle cx="10.8" cy="10.8" r="6.8"></circle>
                            <path d="M16 16l5 5"></path>
                        </svg>
                    </button>
                    <button class="artifact-search" id="artifactTrashOpenButton" type="button" title="ゴミ箱" aria-label="ゴミ箱">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 6h18"></path>
                            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                            <path d="M10 11v6"></path>
                            <path d="M14 11v6"></path>
                        </svg>
                    </button>
                    <button class="artifact-add" id="artifactAddButton" type="button">新規記録メモ</button>
                </div>
            </header>

            <main class="artifact-grid" id="artifactGrid" aria-live="polite"></main>
        </div>
    </section>

    <section class="artifact-editor-view" id="artifactEditorView" aria-hidden="true">
        <header class="artifact-editor-bar">
            <div class="artifact-editor-left">
                <button class="artifact-editor-icon" id="artifactEditorBackButton" type="button" title="一覧へ戻る" aria-label="一覧へ戻る">
                    <svg viewBox="0 0 24 24">
                        <path d="M15 18l-6-6 6-6"></path>
                    </svg>
                </button>
            </div>

            <div class="artifact-editor-right">
                <button class="artifact-editor-download" id="artifactEditorDownloadButton" type="button">ダウンロード</button>
                <button class="artifact-editor-delete" id="artifactEditorDeleteButton" type="button">ゴミ箱へ</button>
                <button class="artifact-editor-save" id="artifactEditorSaveButton" type="button">保存</button>
            </div>
        </header>

        <div class="artifact-editor-scroll" id="artifactEditorScroll">
            <div class="artifact-editor-content">
                <textarea
                    class="artifact-editor-title"
                    id="artifactEditorTitle"
                    rows="1"
                    placeholder="タイトル"></textarea>

                <textarea
                    class="artifact-editor-body"
                    id="artifactEditorBody"
                    placeholder="メモの内容を入力..."></textarea>

                <div class="artifact-editor-status" id="artifactEditorStatus"></div>
            </div>
        </div>
    </section>

    <section class="artifact-trash-view" id="artifactTrashView" aria-hidden="true">
        <div class="artifact-trash-scroll">
            <div class="artifact-trash-shell">
                <header class="artifact-trash-top">
                    <h2 class="artifact-trash-title">ゴミ箱</h2>
                    <div class="artifact-trash-actions">
                        <button id="artifactRestoreAllButton" type="button">全て復元</button>
                        <button id="artifactEmptyTrashButton" type="button">全て削除</button>
                        <button id="artifactCloseTrashButton" type="button">完了</button>
                    </div>
                </header>
                <main class="artifact-trash-list" id="artifactTrashList"></main>
            </div>
        </div>
    </section>

    <div class="artifact-snackbar" id="artifactSnackbar">
        <span id="artifactSnackbarMessage"></span>
        <button id="artifactSnackbarUndoButton" type="button">元に戻す</button>
    </div>
</div>

<script>
(() => {
    "use strict";

    const STORAGE_KEY = "notes";

    let notes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
    { id: '1', title: 'お客様を歓迎します！', content: '', isDeleted: false },
    { id: '2', title: '必ずご確認ください', content: '記録ノートへようこそ。', isDeleted: false }
];
    let activeEditId = null;
    let undoTimeout = null;
    let undoAction = null;

    const getElement = (id) => {
        const element = document.getElementById(id);
        if (!element) {
            console.error(`[Artifact] DOM要素が見つかりません: #${id}`);
        }
        return element;
    };

    const artifactGrid = getElement("artifactGrid");
    const artifactActions = getElement("artifactActions");
    const artifactSearchButton = getElement("artifactSearchButton");
    const artifactSearchInput = getElement("artifactSearchInput");
    const artifactAddButton = getElement("artifactAddButton");

    const artifactListView = getElement("artifactListView");
    const artifactEditorView = getElement("artifactEditorView");
    const artifactEditorBackButton = getElement("artifactEditorBackButton");
    const artifactEditorTitle = getElement("artifactEditorTitle");
    const artifactEditorBody = getElement("artifactEditorBody");
    const artifactEditorScroll = getElement("artifactEditorScroll");
    const artifactEditorStatus = getElement("artifactEditorStatus");
    const artifactEditorSaveButton = getElement("artifactEditorSaveButton");
    const artifactEditorDeleteButton = getElement("artifactEditorDeleteButton");
    const artifactEditorDownloadButton = getElement("artifactEditorDownloadButton");

    const artifactTrashOpenButton = getElement("artifactTrashOpenButton");
    const artifactTrashList = getElement("artifactTrashList");
    const artifactRestoreAllButton = getElement("artifactRestoreAllButton");
    const artifactEmptyTrashButton = getElement("artifactEmptyTrashButton");
    const artifactCloseTrashButton = getElement("artifactCloseTrashButton");

    const artifactSnackbar = getElement("artifactSnackbar");
    const artifactSnackbarMessage = getElement("artifactSnackbarMessage");
    const artifactSnackbarUndoButton = getElement("artifactSnackbarUndoButton");

    function saveNotes() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
            console.info("[Artifact] メモを保存しました。");
        } catch (error) {
            console.error("[Artifact] localStorageへの保存に失敗しました。", error);
        }
    }

    function generateId() {
        return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
    }

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>'"]/g, (tag) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "'": "&#39;",
            '"': "&quot;"
        }[tag]));
    }

    function formatDate(note) {
        const timestamp = Number(note.updatedAt || note.createdAt);
        if (!Number.isFinite(timestamp)) {
            return "編集済み";
        }

        const date = new Date(timestamp);
        const now = new Date();

        if (date.toDateString() === now.toDateString()) {
            return "今日編集済み";
        }

        const diff = Math.floor((Date.now() - timestamp) / 86400000);
        if (diff === 1) return "昨日編集済み";
        if (diff >= 2 && diff < 30) return `${diff}日前に編集済み`;

        return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, "0")}/${String(date.getDate()).padStart(2, "0")} 編集済み`;
    }

    function autoResize(textarea) {
        if (!textarea || !artifactEditorScroll) {
            console.error("[Artifact] autoResize対象がnullです。");
            return;
        }
        const scrollTop = artifactEditorScroll.scrollTop;
        textarea.style.height = "auto";
        textarea.style.height = `${textarea.scrollHeight}px`;
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                artifactEditorScroll.scrollTop = scrollTop;
            });
        });
    }

    function setBodyHeight() {
        if (!artifactEditorBody || !artifactEditorScroll) return;
        const scrollTop = artifactEditorScroll.scrollTop;
        artifactEditorBody.style.height = "auto";
        artifactEditorBody.style.height = `${Math.max(artifactEditorBody.scrollHeight, window.innerHeight * 0.56)}px`;
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                artifactEditorScroll.scrollTop = scrollTop;
            });
        });
    }

    function openEditor(note) {
        if (!note || !artifactEditorView || !artifactEditorTitle || !artifactEditorBody) {
            console.error("[Artifact] 編集画面を開けません。noteまたはDOMが不足しています。");
            return;
        }

        activeEditId = note.id;
        artifactEditorTitle.value = note.title || "";
        artifactEditorBody.value = note.content || "";
        artifactEditorStatus.textContent = note.id ? formatDate(note) : "新規記録メモ";

        artifactListView?.scrollTo({ top: 0 });
        artifactTrashView?.classList.remove("active");
        artifactEditorView.classList.add("active");
        artifactEditorView.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";

        requestAnimationFrame(() => {
            autoResize(artifactEditorTitle);
            setBodyHeight();
            artifactEditorTitle.focus();
            console.info(`[Artifact] 編集画面を開きました: ${note.id}`);
        });
    }

    function openNewEditor() {
        const newNote = {
            id: generateId(),
            title: "",
            content: "",
            isDeleted: false,
            createdAt: Date.now(),
            updatedAt: Date.now()
        };

        notes.unshift(newNote);
        saveNotes();
        openEditor(newNote);
        console.info("[Artifact] 新規記録メモの編集画面を開きました。");
    }

    function saveActiveEditor() {
        if (!activeEditId) {
            console.error("[Artifact] activeEditIdが設定されていないため保存できません。");
            return false;
        }

        const note = notes.find((item) => item.id === activeEditId);

        if (!note) {
            console.error(`[Artifact] 編集中の記録メモが見つかりません: ${activeEditId}`);
            return false;
        }

        const title = artifactEditorTitle?.value.trim() ?? "";
        const content = artifactEditorBody?.value.trim() ?? "";

        note.title = title || "無題の記録メモ";
        note.content = content;
        note.updatedAt = Date.now();
        note.isDeleted = false;

        saveNotes();
        if (artifactEditorStatus) {
            artifactEditorStatus.textContent = "保存しました";
        }

        renderNotes(artifactSearchInput?.value || "");
        console.info(`[Artifact] 記録メモを保存しました: ${note.id}`);
        return true;
    }

    function closeEditor({ save = true } = {}) {
        if (save && activeEditId) {
            const saved = saveActiveEditor();
            if (!saved) {
                console.error("[Artifact] 編集画面を閉じる前の保存に失敗しました。");
                return;
            }
        }

        artifactEditorView?.classList.remove("active");
        artifactEditorView?.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        activeEditId = null;

        renderNotes(artifactSearchInput?.value || "");
        console.info("[Artifact] 編集画面を閉じました。");
    }

    let renderedCount = 0;
    let filteredCache = [];

    function renderNotes(query = "") {
        if (!artifactGrid) {
            console.error("[Artifact] #artifactGrid が存在しないため一覧を描画できません。");
            return;
        }

        const normalizedQuery = String(query || "").trim().toLowerCase();
        const activeNotes = notes.filter((note) => !note.isDeleted);

        filteredCache = activeNotes.filter((note) => {
            if (!normalizedQuery) return true;
            return `${note.title || ""}\n${note.content || ""}`.toLowerCase().includes(normalizedQuery);
        });

        artifactGrid.innerHTML = "";
        renderedCount = 0;

        if (filteredCache.length === 0) {
            artifactGrid.innerHTML = `
                <div class="artifact-empty">
                    ${normalizedQuery ? "一致する記録メモがありません。" : "まだ記録メモがありません。"}
                </div>
            `;
            console.info("[Artifact] 一覧は空です。");
            return;
        }

        const initialBatch = filteredCache.slice(0, 20);
        const fragment = document.createDocumentFragment();

        initialBatch.forEach((note) => {
            const card = createNoteCard(note);
            fragment.appendChild(card);
        });

        renderedCount = initialBatch.length;
        artifactGrid.appendChild(fragment);

        if (renderedCount < filteredCache.length) {
            const loadMoreBtn = document.createElement("button");
            loadMoreBtn.className = "artifact-load-more";
            loadMoreBtn.type = "button";
            loadMoreBtn.textContent = `もっと見る (${filteredCache.length - renderedCount}件)`;
            loadMoreBtn.addEventListener("click", loadMoreNotes);
            artifactGrid.appendChild(loadMoreBtn);
        }

        console.info(`[Artifact] 一覧を描画しました: ${renderedCount}/${filteredCache.length}件`);
    }

    function loadMoreNotes() {
        const btn = artifactGrid.querySelector(".artifact-load-more");
        if (btn) btn.remove();

        const nextBatch = filteredCache.slice(renderedCount, renderedCount + 20);
        const fragment = document.createDocumentFragment();

        nextBatch.forEach((note) => {
            const card = createNoteCard(note);
            fragment.appendChild(card);
        });

        renderedCount += nextBatch.length;
        artifactGrid.appendChild(fragment);

        if (renderedCount < filteredCache.length) {
            const loadMoreBtn = document.createElement("button");
            loadMoreBtn.className = "artifact-load-more";
            loadMoreBtn.type = "button";
            loadMoreBtn.textContent = `もっと見る (${filteredCache.length - renderedCount}件)`;
            loadMoreBtn.addEventListener("click", loadMoreNotes);
            artifactGrid.appendChild(loadMoreBtn);
        }

        console.info(`[Artifact] 追加読込: ${renderedCount}/${filteredCache.length}件`);
    }

    function createNoteCard(note) {
        const card = document.createElement("article");
        card.className = "artifact-card";
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", `${note.title || "無題の記録メモ"}を開く`);

        const title = note.title || "無題の記録メモ";
        const content = note.content || "";

        let previewHTML = "";

        if (content) {
            const looksLikeCode =
                /(^|\n)\s*(import |export |const |let |function |class |struct |@main|#include|\/\/)/.test(content);

            previewHTML = `
                <div class="artifact-preview-inner">
                    <div class="artifact-preview-title">${escapeHTML(title)}</div>
                    <div class="${looksLikeCode ? "artifact-preview-code" : "artifact-preview-text"}">
                        ${escapeHTML(content.slice(0, 500))}
                    </div>
                </div>
            `;
        } else if (title) {
            previewHTML = `
                <div class="artifact-preview-inner">
                    <div class="artifact-preview-title">${escapeHTML(title)}</div>
                </div>
            `;
        } else {
            previewHTML = `
                <div class="artifact-preview-empty" aria-hidden="true">
                    <svg viewBox="0 0 48 48">
                        <circle cx="24" cy="24" r="10"></circle>
                        <path d="M14 31c6-10 14-10 20 0"></path>
                        <path d="M14 17c6 10 14 10 20 0"></path>
                    </svg>
                </div>
            `;
        }

        card.innerHTML = `
            <div class="artifact-preview">${previewHTML}</div>
            <div class="artifact-meta">
                <div class="artifact-title">${escapeHTML(title)}</div>
                <div class="artifact-date">${escapeHTML(formatDate(note))}</div>
            </div>
        `;

        const openHandler = () => openEditor(note);
        card.addEventListener("click", openHandler);
        card.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                openHandler();
            }
        });

        return card;
    }

    function renderTrash() {
        if (!artifactTrashList) {
            console.error("[Artifact] #artifactTrashList が存在しません。");
            return;
        }

        const deletedNotes = notes.filter((note) => note.isDeleted);
        artifactTrashList.innerHTML = "";

        if (deletedNotes.length === 0) {
            artifactTrashList.innerHTML = `<div class="artifact-empty">ゴミ箱は空です。</div>`;
            console.info("[Artifact] ゴミ箱は空です。");
            return;
        }

        const fragment = document.createDocumentFragment();

        deletedNotes.forEach((note) => {
            const item = document.createElement("article");
            item.className = "artifact-trash-item";

            const title = note.title || "無題の記録メモ";
            const body = note.content || "";

            item.innerHTML = `
                <div class="artifact-trash-item-text">
                    <div class="artifact-trash-item-title">${escapeHTML(title)}</div>
                    <div class="artifact-trash-item-body">${escapeHTML(body)}</div>
                </div>
                <div class="artifact-trash-item-actions">
                    <button type="button" data-action="restore">復元</button>
                    <button type="button" data-action="delete">完全削除</button>
                </div>
            `;

            const restoreButton = item.querySelector('[data-action="restore"]');
            const deleteButton = item.querySelector('[data-action="delete"]');

            if (!restoreButton || !deleteButton) {
                console.error(`[Artifact] ゴミ箱操作ボタンを生成できませんでした: ${note.id}`);
                return;
            }

            restoreButton.addEventListener("click", () => {
                note.isDeleted = false;
                note.updatedAt = Date.now();
                saveNotes();
                renderTrash();
                renderNotes(artifactSearchInput?.value || "");
                showSnackbar("記録メモを復元しました。", {
                    type: "restore",
                    note
                });
                console.info(`[Artifact] 復元しました: ${note.id}`);
            });

            deleteButton.addEventListener("click", () => {
                notes = notes.filter((item) => item.id !== note.id);
                saveNotes();
                renderTrash();
                showSnackbar("記録メモを完全に削除しました。");
                console.info(`[Artifact] 完全削除しました: ${note.id}`);
            });

            fragment.appendChild(item);
        });

        artifactTrashList.appendChild(fragment);
        console.info(`[Artifact] ゴミ箱を描画しました: ${deletedNotes.length}件`);
    }

    function openTrash() {
        renderTrash();
        artifactTrashView?.classList.add("active");
        artifactTrashView?.setAttribute("aria-hidden", "false");
        console.info("[Artifact] ゴミ箱を開きました。");
    }

    function closeTrash() {
        artifactTrashView?.classList.remove("active");
        artifactTrashView?.setAttribute("aria-hidden", "true");
        console.info("[Artifact] ゴミ箱を閉じました。");
    }

    function showSnackbar(message, action = null) {
        if (!artifactSnackbar || !artifactSnackbarMessage) {
            console.error("[Artifact] スナックバーのDOMが不足しています。");
            return;
        }

        artifactSnackbarMessage.textContent = message;
        undoAction = action;
        artifactSnackbar.classList.add("active");

        if (undoTimeout) {
            clearTimeout(undoTimeout);
        }

        undoTimeout = setTimeout(() => {
            artifactSnackbar.classList.remove("active");
            undoAction = null;
            console.info("[Artifact] スナックバーを閉じました。");
        }, 5000);

        console.info(`[Artifact] スナックバー表示: ${message}`);
    }

    function deleteActiveEditor() {
        if (!activeEditId) {
            console.error("[Artifact] activeEditIdがないため削除できません。");
            return;
        }

        const note = notes.find((item) => item.id === activeEditId);
        if (!note) {
            console.error(`[Artifact] 削除対象が見つかりません: ${activeEditId}`);
            return;
        }

        const snapshot = JSON.parse(JSON.stringify(note));
        note.isDeleted = true;
        note.updatedAt = Date.now();

        saveNotes();
        renderNotes(artifactSearchInput?.value || "");
        closeEditor({ save: false });

        showSnackbar("ゴミ箱へ移動しました。", {
            type: "restore-deleted",
            note: snapshot
        });

        console.info(`[Artifact] ゴミ箱へ移動しました: ${note.id}`);
    }

    function downloadActiveEditor() {
        if (!artifactEditorTitle || !artifactEditorBody) {
            console.error("[Artifact] ダウンロード対象の入力欄がありません。");
            return;
        }

        const title = artifactEditorTitle.value.trim() || "artifact";
        const content = artifactEditorBody.value || "";
        const blob = new Blob([`${title}\n\n${content}`], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);

        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = `${title.replace(/[\\/:*?"<>|]/g, "_")}.txt`;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(url);

        console.info(`[Artifact] ダウンロードしました: ${title}`);
    }

    artifactAddButton?.addEventListener("click", openNewEditor);

    artifactTrashOpenButton?.addEventListener("click", openTrash);

    artifactSearchButton?.addEventListener("click", () => {
        if (!artifactActions) {
            console.error("[Artifact] 検索UIの親要素がありません。");
            return;
        }

        artifactActions.classList.add("search-open");
        artifactSearchInput?.focus();
        console.info("[Artifact] 検索欄を開きました。");
    });

    artifactSearchInput?.addEventListener("input", (event) => {
        renderNotes(event.target.value);
    });

    artifactSearchInput?.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
            event.currentTarget.value = "";
            artifactActions?.classList.remove("search-open");
            renderNotes("");
            console.info("[Artifact] 検索を終了しました。");
        }
    });

    artifactEditorBackButton?.addEventListener("click", () => closeEditor({ save: true }));
    artifactEditorSaveButton?.addEventListener("click", () => {
        if (saveActiveEditor()) {
            closeEditor({ save: false });
        }
    });

    artifactEditorDeleteButton?.addEventListener("click", deleteActiveEditor);
    artifactEditorDownloadButton?.addEventListener("click", downloadActiveEditor);

    artifactEditorTitle?.addEventListener("input", () => autoResize(artifactEditorTitle));
    artifactEditorBody?.addEventListener("input", () => {
        setBodyHeight();
    });

    artifactCloseTrashButton?.addEventListener("click", closeTrash);

    artifactRestoreAllButton?.addEventListener("click", () => {
        const deleted = notes.filter((note) => note.isDeleted);
        if (deleted.length === 0) {
            console.info("[Artifact] 復元対象はありません。");
            return;
        }

        notes.forEach((note) => {
            if (note.isDeleted) {
                note.isDeleted = false;
                note.updatedAt = Date.now();
            }
        });

        saveNotes();
        renderTrash();
        renderNotes(artifactSearchInput?.value || "");
        console.info(`[Artifact] ${deleted.length}件を一括復元しました。`);
    });

    artifactEmptyTrashButton?.addEventListener("click", () => {
        const deletedCount = notes.filter((note) => note.isDeleted).length;
        if (deletedCount === 0) {
            console.info("[Artifact] ゴミ箱はすでに空です。");
            return;
        }

        if (!window.confirm("ゴミ箱内の記録メモを完全に削除しますか？この操作は取り消せません。")) {
            console.info("[Artifact] ゴミ箱の完全削除をキャンセルしました。");
            return;
        }

        notes = notes.filter((note) => !note.isDeleted);
        saveNotes();
        renderTrash();
        renderNotes(artifactSearchInput?.value || "");
        console.info(`[Artifact] ゴミ箱を空にしました: ${deletedCount}件`);
    });

    artifactSnackbarUndoButton?.addEventListener("click", () => {
        if (!undoAction) {
            console.warn("[Artifact] 元に戻す対象がありません。");
            return;
        }

        if (undoAction.type === "restore-deleted") {
            const note = notes.find((item) => item.id === undoAction.note.id);
            if (note) {
                note.isDeleted = false;
                note.updatedAt = Date.now();
                saveNotes();
                renderNotes(artifactSearchInput?.value || "");
                console.info(`[Artifact] 削除を取り消しました: ${note.id}`);
            } else {
                notes.push(undoAction.note);
                saveNotes();
                renderNotes(artifactSearchInput?.value || "");
                console.info("[Artifact] 削除取り消し用スナップショットを復元しました。");
            }
        } else if (undoAction.type === "restore") {
            const note = notes.find((item) => item.id === undoAction.note.id);
            if (note) {
                note.isDeleted = true;
                saveNotes();
                renderNotes(artifactSearchInput?.value || "");
                renderTrash();
                console.info(`[Artifact] 復元を取り消しました: ${note.id}`);
            }
        }

        artifactSnackbar?.classList.remove("active");
        undoAction = null;

        if (undoTimeout) {
            clearTimeout(undoTimeout);
            undoTimeout = null;
        }
    });

    document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;

        if (artifactEditorView?.classList.contains("active")) {
            closeEditor({ save: true });
            return;
        }

        if (artifactTrashView?.classList.contains("active")) {
            closeTrash();
        }
    });

    window.addEventListener("resize", () => {
        if (artifactEditorView?.classList.contains("active")) {
            autoResize(artifactEditorTitle);
            if (artifactEditorBody) {
                setBodyHeight();
            }
        }
    });

    // 旧UIからの連携用。外部側にゴミ箱ボタンを追加したい場合に利用可能。
    window.ArtifactUI = {
        renderNotes,
        renderTrash,
        openTrash,
        openEditor,
        saveNotes
    };

    // 元データの既存形式に createdAt / updatedAt が無い場合だけ補完。
    notes = notes.map((note) => ({
        id: note.id || generateId(),
        title: typeof note.title === "string" ? note.title : "",
        content: typeof note.content === "string" ? note.content : "",
        isDeleted: Boolean(note.isDeleted),
        createdAt: Number(note.createdAt) || Date.now(),
        updatedAt: Number(note.updatedAt) || Number(note.createdAt) || Date.now()
    }));

    saveNotes();
    renderNotes();

    console.info("[Artifact] 記録メモUI版を初期化しました。");
})();
</script>
</body>
</html>
