<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>タイマー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded&display=swap" rel="stylesheet">
<style>
  :root {
    --font: "Inter", "Noto Sans JP", system-ui, sans-serif;
    --k: clamp(44px, min(9vw, 12vh), 64px);
    --shadow-dark: inset 1px 0px 0.5px 0px rgba(0,0,0,0.45), inset -1px 0px 0.5px 0px rgba(0,0,0,0.45), inset 0px 1px 0.5px 0px rgba(255,255,255,0.45), inset 0px -1px 0.5px 0px rgba(255,255,255,0.45), 0px 4px 27px 0px rgba(0,0,0,0.1);
    --shadow-light: inset 0px 1px 0.5px 0px rgba(255,255,255,0.45), inset 0px -1px 0.5px 0px rgba(255,255,255,0.45), inset 1px 0px 0.5px 0px rgba(0,0,0,0.45), inset -1px 0px 0.5px 0px rgba(0,0,0,0.45), 0px 4px 27px 0px rgba(0,0,0,0.06);
  }
  /* ダーク（既定） */
  body {
    --fg: #fff;
    --fg-sub: rgba(255,255,255,0.72);
    --key-bg: #00000044;
    --sw-off: #CACACA77;
    --start-bg: #fff;
    --start-fg: #000;
  }
  /* ライト */
  body.light {
    --fg: #000;
    --fg-sub: rgba(0,0,0,0.3);
    --key-bg: rgba(255,255,255,0.3);
    --sw-off: #78787877;
    --start-bg: #000;
    --start-fg: #fff;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: var(--font);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  /* ---------- 開始画面（HTML） ---------- */
  #setup {
    position: fixed;
    inset: 0;
    overflow: hidden;
    transition: opacity 0.3s ease;
  }
  #setup.off { opacity: 0; pointer-events: none; }
  /* 背景：ぼかした壁紙を2枚重ねてテーマ切替時にクロスフェード */
  .bg {
    position: absolute;
    inset: -80px;
    filter: blur(40px);
    transition: opacity 0.3s ease;
  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
  }
  .bg-dark { background: var(--wp-dark); }
  .bg-dark::after { background: rgba(0,0,0,0.35); }
  .bg-light { background: var(--wp-light); opacity: 0; }
  .bg-light::after { background: rgba(255,255,255,0.45); }
  body.light .bg-dark { opacity: 0; }
  body.light .bg-light { opacity: 1; }
  .setup-inner {
    position: relative;
    z-index: 1;
    display: flex;
    gap: clamp(24px, 6vw, 64px);
    width: min(92vw, 760px);
    height: 100%;
    max-height: 100%;
    padding: 24px;
    margin: auto;
    align-items: center;
  }
  .left {
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 3vh, 24px);
    flex: none;
    align-items:center;
  }
  .display {
    font-size: clamp(36px, 8vh, 56px);
    font-weight: 300;
    line-height: 1;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
    color: var(--fg);
    transition: color 0.3s ease;
  }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, var(--k));
    gap: clamp(8px, 1.6vh, 14px);
  }
  .key {
    position: relative;
    width: var(--k);
    height: var(--k);
    padding: 0;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background-color: var(--key-bg);
    color: var(--fg);
    font: 400 calc(var(--k) * 0.4) / 1 var(--font);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    cursor: pointer;
    transition: transform 0.08s ease, background-color 0.3s ease, color 0.3s ease;
  }
  .key span { position: relative; }
  .key::before, .key::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .key::before { box-shadow: var(--shadow-dark); opacity: 1; }
  .key::after  { box-shadow: var(--shadow-light); opacity: 0; }
  body.light .key::before { opacity: 0; }
  body.light .key::after  { opacity: 1; }
  .key:active { transform: scale(1.2); }
  .key:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .key[data-d="0"] { grid-column: 2; }
  .right {
    display: flex;
    flex-direction: column;
    justify-content:center;
    align-self: stretch;
    flex: 1;
    min-width: 0;
    gap:48px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 3.2vh, 24px);
  }
  .opt {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    color: var(--fg);
    transition: color 0.3s ease;
    cursor: pointer;
  }
  .opt-label { font-size: clamp(15px, 2.3vh, 20px); font-weight: 400; }
  .opt input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }
  /* 横に少し長いスイッチ */
  .switch {
    position: relative;
    flex: none;
    width: 71px;
    height: 29px;
    border-radius: 17px;
    background-color: var(--sw-off);
    transition: background-color 0.3s ease;
}
  .switch::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 38px;
    height: 23px;
    border-radius: 99px;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    transition: transform 0.25s ease;
}
  .opt input:checked + .switch { background-color: #1EDD4E; }
  .opt input:checked + .switch::after { transform: translateX(26px); }
  .opt input:focus-visible + .switch { outline: 2px solid var(--fg); outline-offset: 3px; }
  .note {
    margin: 0;
    font-size: clamp(11px, 1.7vh, 13px);
    line-height: 1.6;
    color: var(--fg-sub);
    transition: color 0.3s ease;
  }
  .start-btn {
    align-self: flex-end;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 14px 28px 14px 18px;
    border: 0;
    border-radius: 999px;
    background-color: var(--start-bg);
    color: var(--start-fg);
    font: 600 clamp(18px, 3vh, 24px) / 1 var(--font);
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    cursor: pointer;
    transition: background-color 0.3s ease, color 0.3s ease, opacity 0.2s ease;
  }
  .start-btn .material-icons-round { font-size: 1.2em; }
  .start-btn:disabled { opacity: 0.35; cursor: default; }
  .start-btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  /* ---------- 再生画面（canvas） ---------- */
  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    cursor: pointer;
    touch-action: manipulation;
  }
  #stage.on { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<div id="setup">
  <div class="bg bg-dark"></div>
  <div class="bg bg-light"></div>
  <div class="setup-inner">
    <div class="left">
      <div id="display" class="display">00:00:00</div>
      <div class="keypad">
        <button class="key" data-d="1" aria-label="1"><span>1</span></button>
        <button class="key" data-d="2" aria-label="2"><span>2</span></button>
        <button class="key" data-d="3" aria-label="3"><span>3</span></button>
        <button class="key" data-d="4" aria-label="4"><span>4</span></button>
        <button class="key" data-d="5" aria-label="5"><span>5</span></button>
        <button class="key" data-d="6" aria-label="6"><span>6</span></button>
        <button class="key" data-d="7" aria-label="7"><span>7</span></button>
        <button class="key" data-d="8" aria-label="8"><span>8</span></button>
        <button class="key" data-d="9" aria-label="9"><span>9</span></button>
        <button class="key" data-d="0" aria-label="0"><span>0</span></button>
      </div>
    </div>
    <div class="right">
      <div class="options">
        <label class="opt">
          <span class="opt-label">ライトテーマ</span>
          <input type="checkbox" id="optLight">
          <i class="switch"></i>
        </label>
        <label class="opt">
          <span class="opt-label">日付とバッテリー残量を表示</span>
          <input type="checkbox" id="optInfo" checked>
          <i class="switch"></i>
        </label>
        <label class="opt">
          <span class="opt-label">完了時に通知</span>
          <input type="checkbox" id="optCompletionNotice" checked>
          <i class="switch"></i>
        </label>
        <label class="opt">
          <span class="opt-label">フルスクリーン</span>
          <input type="checkbox" id="optFull" checked>
          <i class="switch"></i>
        </label>
      </div>
      <p class="note">設定画面に戻るには一時停止してから<br>右下に表示されるホームボタンをタップします。</p>
      <button id="startBtn" class="start-btn" disabled>
        <span class="material-icons-round" aria-hidden="true">play_arrow</span>
        <span>開始</span>
      </button>
    </div>
  </div>
</div>
<canvas id="stage" aria-label="タイマー再生画面。完了時は終了または続けるを選択できます。"></canvas>
<script>
(() => {
  /* ===== 設定 ===== */
  // 角度は canvas 基準（0 = 右、時計回り正）。stops は中心から時計回りに並ぶ 0〜1。
  const WALLPAPER = {
    dark:  { start: 0, stops: [[0, '#000000'], [0.5, '#003893'], [0.95, '#75FFF8'], [1, '#75FFF8']] },
    light: { start: 0, stops: [[0, '#FFFFFF'], [0.3, '#FFFFFF'], [0.6, '#8DF9FF'], [0.85, '#0077FF'], [1, '#0077FF']] }
  };
  const CANVAS_FONT = '"Inter", "Noto Sans JP", sans-serif';
  const ICON_FONT = '"Material Icons Round"';
  const ICON_SYMBOL_FONT = '"Material Symbols Rounded"';
  const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
  // Canvas はアイコンのリガチャに対応しないため、Material Symbols の codepoint を直接描画。
  const ICON = {
    play: '\ue037',
    pause: '\ue034',
    home: '\ue88a',
    batAndroid0: '\uf30d',
    batAndroid1: '\uf30c',
    batAndroid2: '\uf30b',
    batAndroid3: '\uf30a',
    batAndroid4: '\uf309',
    batAndroid5: '\uf308',
    batAndroid6: '\uf307',
    batAndroidFull: '\uf304'
  };
  const BATTERY_ICONS = [
    ICON.batAndroid0,
    ICON.batAndroid1,
    ICON.batAndroid2,
    ICON.batAndroid3,
    ICON.batAndroid4,
    ICON.batAndroid5,
    ICON.batAndroid6
  ];
  const TAU = Math.PI * 2;
  const PI = Math.PI;
  // Canvas の 0 度は右向き。270 度にしてグラデーションの開始位置を真上へ。
  const CANVAS_GRADIENT_START_OFFSET = 270;
  /* ===== ユーティリティ ===== */
  const $ = id => document.getElementById(id);
  const pad2 = n => String(n).padStart(2, '0');
  // easeInOutCubic
  const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  // 数値のイージング（go で目標を変えた瞬間の現在値から滑らかに遷移）
  class Tween {
    constructor(v) { this.a = v; this.b = v; this.t0 = 0; this.dur = 0; }
    value(now) {
      if (!this.dur) return this.b;
      const t = Math.min(1, Math.max(0, (now - this.t0) / this.dur));
      return this.a + (this.b - this.a) * ease(t);
    }
    go(target, now, dur) {
      this.a = this.value(now);
      this.b = target;
      this.t0 = now;
      this.dur = dur;
    }
  }
  // 文字・アイコンのクロスフェード（旧と新を同時にフェード。フェードアウト→インではない）
  class Crossfade {
    constructor() { this.prev = null; this.cur = null; this.t0 = 0; this.dur = 0; }
    set(v, now, dur) {
      if (v === this.cur) return;
      if (this.cur !== null) this.prev = this.cur;
      this.cur = v;
      this.t0 = now;
      this.dur = this.prev === null ? 0 : dur; // 初回は即時表示
    }
    draw(now, fn) {
      const t = this.dur ? Math.min(1, (now - this.t0) / this.dur) : 1;
      const e = ease(t);
      if (this.prev !== null && t < 1) fn(this.prev, 1 - e);
      fn(this.cur, e);
      if (t >= 1) this.prev = null;
    }
  }
  /* ===== 要素 ===== */
  const setupEl = $('setup');
  const stage = $('stage');
  const displayEl = $('display');
  const startBtn = $('startBtn');
  const optLight = $('optLight');
  const optInfo = $('optInfo');
  const optFull = $('optFull');
  const optCompletionNotice = $('optCompletionNotice');
  const requiredElements = { setupEl, stage, displayEl, startBtn, optLight, optInfo, optFull, optCompletionNotice };
  const missingElements = Object.entries(requiredElements)
    .filter(([, element]) => !element)
    .map(([name]) => name);
  if (missingElements.length > 0) {
    console.error('[timer] 必須のHTML要素が見つかりません:', missingElements);
    return;
  }
  const ctx = stage.getContext('2d');
  if (!ctx) {
    console.error('[timer] Canvas 2D コンテキストを取得できませんでした。');
    return;
  }
  console.info('[timer] 必須のHTML要素とCanvasを確認しました。');
  /* ===== 状態 ===== */
  let digits = '000000'; // HHMMSS
  const state = {
    phase: 'setup',   // 'setup' | 'playing' | 'complete'
    theme: 'dark',
    running: false,
    accum: 0,         // 一時停止までの経過ms
    segStart: 0,      // 直近の再開時刻
    total: 0,         // 総時間ms
    looping: false,
    fadeEnd: 0,       // 設定へ戻るフェードの終了時刻
    battery: null,
    completionHandled: false,
    finishedWithoutNotice: false,
    audioUnlockAttempted: false,
    audioUnlocked: false,
    completionFadeStart: 0
  };
  let W = 0, H = 0, DPR = 1, U = 1;
  let glassKey = '', glassLayer = null, glassSize = 0, glassR = 0;
  let wakeLock = null;
  let contrastSamplingWarningLogged = false;
  let completionBgCanvas = null;
  let completionBgKey = '';
  let completionBgLayout = null;
  let completionPreviousFrame = null;
  const COMPLETION_FADE_DURATION = 520;
  const completionAudio = new Audio(new URL('./Sedna.ogg', document.baseURI).href);
  completionAudio.loop = true;
  completionAudio.preload = 'auto';
  completionAudio.addEventListener('error', () => {
    console.warn('[timer] Sedna.ogg を読み込めませんでした。同じフォルダに音声ファイルがあるか確認してください。', completionAudio.error?.code ?? 'unknown');
  }, { once: true });
  completionAudio.load();
  let pauseT = new Tween(0);
  let labelFade = new Crossfade();
  let iconFade = new Crossfade();
  const batIconFade = new Crossfade();
  const batTween = new Tween(0);
  /* ===== テーマ（設定画面の背景・色はCSSのtransitionで切替） ===== */
  const cssWallpaper = th => {
    const { start, stops } = WALLPAPER[th];
    const list = stops.map(([t, c]) => `${c} ${(t * 100).toFixed(1)}%`).join(', ');
    return `conic-gradient(from ${start}deg at 50% 50%, ${list})`;
  };
  function applyTheme() {
    state.theme = optLight.checked ? 'light' : 'dark';
    document.body.classList.toggle('light', state.theme === 'light');
  }
  /* ===== 開始画面：入力 ===== */
  const parseDigits = s => (+s.slice(0, 2)) * 3600 + (+s.slice(2, 4)) * 60 + (+s.slice(4, 6));
  const fmtDigits = s => s.replace(/(\d{2})(\d{2})(\d{2})/, '$1:$2:$3');
  function updateSetup() {
    displayEl.textContent = fmtDigits(digits);
    startBtn.disabled = parseDigits(digits) === 0;
  }
  const pushDigit = d => { digits = digits.slice(1) + d; updateSetup(); };
  const popDigit = () => { digits = '0' + digits.slice(0, 5); updateSetup(); };
  /* ===== 完了音声 ===== */
  function unlockCompletionAudio() {
    if (state.audioUnlockAttempted || state.audioUnlocked) return;
    state.audioUnlockAttempted = true;
    // 開始ボタンのユーザー操作中にミュート再生しておき、完了時の自動再生を許可されやすくする。
    completionAudio.muted = true;
    let playPromise;
    try {
      playPromise = completionAudio.play();
    } catch (error) {
      completionAudio.muted = false;
      state.audioUnlockAttempted = false;
      console.warn('[timer] 音声再生の準備に失敗しました。', error);
      return;
    }
    if (playPromise && typeof playPromise.then === 'function') {
      playPromise.then(() => {
        // 音声準備中にすでに完了画面へ移動していたら、再生中の完了音を止めない。
        if (state.phase !== 'complete') {
          completionAudio.pause();
          try { completionAudio.currentTime = 0; } catch (error) { console.warn('[timer] 音声位置を初期化できませんでした。', error); }
        }
        completionAudio.muted = false;
        state.audioUnlocked = true;
        console.info('[timer] 完了音声の自動再生を準備しました。');
      }).catch(error => {
        completionAudio.muted = false;
        state.audioUnlockAttempted = false;
        if (error?.name === 'AbortError') {
          console.info('[timer] 完了音声の事前準備は再生状態の変更により中断されました。完了時に再試行します。');
        } else {
          console.warn('[timer] 完了音声の自動再生を事前許可できませんでした。完了時に再試行します。', error);
        }
      });
    } else {
      completionAudio.pause();
      completionAudio.muted = false;
      state.audioUnlocked = true;
      console.info('[timer] 完了音声の再生準備を行いました。');
    }
  }
  async function playCompletionAudio() {
    try {
      completionAudio.loop = true;
      completionAudio.muted = false;
      try { completionAudio.currentTime = 0; } catch (error) { console.warn('[timer] 音声位置を先頭に戻せませんでした。', error); }
      const playPromise = completionAudio.play();
      if (playPromise && typeof playPromise.then === 'function') await playPromise;
      console.info('[timer] 完了音声 Sedna.ogg のループ再生を開始しました。');
    } catch (error) {
      if (error?.name === 'AbortError' && state.phase !== 'complete') {
        console.info('[timer] 完了音声の再生要求は、画面遷移に伴って停止されました。');
        return;
      }
      console.warn('[timer] Sedna.ogg を自動再生できませんでした。音声ファイルの配置とブラウザの自動再生設定を確認してください。', error);
    }
  }
  function stopCompletionAudio() {
    completionAudio.pause();
    try { completionAudio.currentTime = 0; } catch (error) { console.warn('[timer] 音声を先頭に戻せませんでした。', error); }
    console.info('[timer] 完了音声を停止しました。');
  }
  /* ===== フルスクリーン / スリープ抑止 ===== */
  function enterFullscreen() {
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!fn) return;
    try { const p = fn.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  }
  function exitFullscreen() {
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    const fn = document.exitFullscreen || document.webkitExitFullscreen;
    if (!fsEl || !fn) return;
    try { const p = fn.call(document); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  }
  async function acquireWake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  function releaseWake() {
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }
  /* ===== 画面遷移・再生制御 ===== */
  function startTimer() {
    const total = parseDigits(digits) * 1000;
    if (!total) return;
    const now = performance.now();
    stopCompletionAudio();
    state.total = total;
    state.accum = 0;
    state.segStart = now;
    state.running = true;
    state.phase = 'playing';
    state.completionHandled = false;
    state.finishedWithoutNotice = false;
    completionPreviousFrame = null;
    if (optCompletionNotice.checked) unlockCompletionAudio();
    console.info(`[timer] タイマーを開始しました: ${Math.floor(total / 1000)}秒`);
    pauseT = new Tween(0);
    labelFade = new Crossfade();
    iconFade = new Crossfade();
    setupEl.classList.add('off');   // 設定はフェードアウト
    stage.classList.add('on');       // 再生画面は同時にフェードイン
    if (optFull.checked) enterFullscreen();
    acquireWake();
    resize();
    ensureLoop();
  }
  function captureCompletionTransitionFrame() {
    if (!stage.width || !stage.height) {
      console.warn('[timer] 完了画面へのフェード用フレームを保存できませんでした。Canvasサイズが0です。');
      return null;
    }
    const frame = document.createElement('canvas');
    frame.width = stage.width;
    frame.height = stage.height;
    const frameCtx = frame.getContext('2d');
    if (!frameCtx) {
      console.error('[timer] 完了画面へのフェード用Canvasコンテキストを取得できませんでした。');
      return null;
    }
    frameCtx.drawImage(stage, 0, 0);

      if (!state.finishedWithoutNotice) togglePlay();
      else console.info('[timer] 通知オフの完了状態では再開操作を無視しました。');
    }
  });
  /* ===== 初期化 ===== */
  document.documentElement.style.setProperty('--wp-dark', cssWallpaper('dark'));
  document.documentElement.style.setProperty('--wp-light', cssWallpaper('light'));
  applyTheme();
  updateSetup();
  resize();
  if (navigator.getBattery) {
    navigator.getBattery()
      .then(b => {
        state.battery = b;
        console.info(`[timer] バッテリー残量を取得しました: ${Math.round(b.level * 100)}%`);
        b.addEventListener('levelchange', () => {
          console.info(`[timer] バッテリー残量が更新されました: ${Math.round(b.level * 100)}%`);
        });
      })
      .catch(error => console.warn('[timer] バッテリー残量を取得できませんでした。', error));
  } else {
    console.info('[timer] この環境は Battery Status API 非対応のため、バッテリーアイコンを非表示にします。');
  }
  if (document.fonts) {
    document.fonts.load('300 56px "Inter"').catch(error => console.warn('[timer] Inter フォントの読み込みに失敗しました。', error));
    document.fonts.load('600 18px "Inter"').catch(error => console.warn('[timer] Inter フォントの読み込みに失敗しました。', error));
    document.fonts.load('600 18px "Noto Sans JP"', 'タップして再開完了').catch(error => console.warn('[timer] Noto Sans JP フォントの読み込みに失敗しました。', error));
    document.fonts.load('20px "Material Icons Round"', ICON.play + ICON.pause + ICON.home).catch(error => console.warn('[timer] Material Icons の読み込みに失敗しました。', error));
    document.fonts.load('20px "Material Symbols Rounded"', BATTERY_ICONS.join('') + ICON.batAndroidFull)
      .then(() => console.info('[timer] Material Symbols のバッテリーアイコンを読み込みました。'))
      .catch(error => console.warn('[timer] Material Symbols の読み込みに失敗しました。', error));
  }
  console.info('[timer] 初期化が完了しました。');
  console.info(`[timer] 完了時の通知は${optCompletionNotice.checked ? '標準でオン' : 'オフ'}です。`);
  console.info('[timer] 完了時の音声ファイル参照先:', new URL('./Sedna.ogg', document.baseURI).href);
})();
</script>
</body>
</html>
