  <div class="maximize-layer" id="maximize-layer" aria-label="全画面表示"></div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEYS = Object.freeze({
        memo: "workspace.memo.v1",
        memoNotes: "workspace.memo.notes.v1",
        calendar: "workspace.calendar.events.v1"
      });
      const root = document.getElementById("dashboard-masonry");
      const maximizeLayer = document.getElementById("maximize-layer");
      const toastRegion = document.getElementById("toast-region");

      if (!root || !maximizeLayer || !toastRegion) {
        console.error("[Workspace] 必要なページ要素が見つかりません。", {
          root: Boolean(root), maximizeLayer: Boolean(maximizeLayer), toastRegion: Boolean(toastRegion)
        });
        return;
      }

      const log = (message, detail) => {
        if (detail === undefined) console.info(`[Workspace] ${message}`);
        else console.info(`[Workspace] ${message}`, detail);
      };
      const reportError = (message, error) => console.error(`[Workspace] ${message}`, error || "原因不明のエラー");
      const safeStorage = {
        get(key, fallback = "") {
          try {
            const value = localStorage.getItem(key);
            return value === null ? fallback : value;
          } catch (error) {
            reportError(`ローカル保存データを読み込めません: ${key}`, error);
            return fallback;
          }
        },
        set(key, value) {
          try {
            localStorage.setItem(key, value);
            return true;
          } catch (error) {
            reportError(`ローカル保存データを書き込めません: ${key}`, error);
            return false;
          }
        },
        remove(key) {
          try {
            localStorage.removeItem(key);
            return true;
          } catch (error) {
            reportError(`ローカル保存データを削除できません: ${key}`, error);
            return false;
          }
        }
      };

      const showToast = (message) => {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        toastRegion.append(toast);
        window.setTimeout(() => toast.remove(), 2400);
      };

      async function copyText(value, successMessage = "コピーしました") {
        const text = String(value ?? "");
        if (!text) {
          showToast("コピーする内容がありません");
          return false;
        }
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
          } else {
            const temporary = document.createElement("textarea");
            temporary.value = text;
            temporary.setAttribute("readonly", "");
            temporary.style.position = "fixed";
            temporary.style.opacity = "0";
            document.body.append(temporary);
            temporary.select();
            const copied = document.execCommand("copy");
            temporary.remove();
            if (!copied) throw new Error("ブラウザがコピー操作を拒否しました");
          }
          showToast(successMessage);
          log("テキストをコピーしました");
          return true;
        } catch (error) {
          reportError("コピーに失敗しました", error);
          showToast("コピーできませんでした");
          return false;
        }
      }

      const getCard = (element) => element?.closest?.(".widget-card") || null;
      const getRole = (card, role) => {
        const element = card?.querySelector(`[data-role="${role}"]`);
        if (!element) reportError(`カード内の要素が見つかりません: ${role}`);
        return element;
      };

      /* Move the actual card node, not a screenshot or duplicate. Its event
         listeners and live widget state therefore keep working in both modes. */
      let activePip = null;
      let activeMaximize = null;

      function restorePip(session, closeWindow = false) {
        if (!session) return;
        if (session.placeholder?.parentNode) {
          session.placeholder.replaceWith(session.card);
        }
        session.card.classList.remove("is-in-pip");
        if (activePip === session) activePip = null;
        if (closeWindow && session.window && !session.window.closed) {
          try { session.window.close(); } catch (error) { reportError("PIPウィンドウを閉じられません", error); }
        }
        log("PIP表示を終了しました");
      }

      async function openPip(card) {
        if (activePip?.card === card) {
          restorePip(activePip, true);
          return;
        }
        if (!("documentPictureInPicture" in window) || !window.isSecureContext) {
          showToast("PIPはHTTPS対応のChromeなどで利用できます");
          reportError("Document Picture-in-Picture APIが利用できません");
          return;
        }
        if (activeMaximize?.card === card) restoreMaximize(true);
        if (activePip) restorePip(activePip, true);

        const bounds = card.getBoundingClientRect();
        const width = Math.max(320, Math.min(620, Math.round(bounds.width || 420)));
        const height = Math.max(360, Math.min(760, Math.round(Math.max(bounds.height, 460))));
        try {
          const pipWindow = await window.documentPictureInPicture.requestWindow({ width, height });
          const style = document.getElementById("app-styles");
          if (!style) throw new Error("スタイルシートが見つかりません");

          const pipStyle = style.cloneNode(true);
          pipStyle.removeAttribute("id");
          pipWindow.document.head.append(pipStyle);
          pipWindow.document.title = `${card.querySelector(".widget-heading")?.textContent || "Tool"} - Workspace`;
          pipWindow.document.body.className = "pip-mode";
          pipWindow.document.body.append(document.createTextNode(""));

          const placeholderRect = card.getBoundingClientRect();
          const placeholder = createWidgetPlaceholder(card, placeholderRect);
          card.parentNode.insertBefore(placeholder, card);
          const session = { card, window: pipWindow, placeholder };
          activePip = session;
          card.classList.add("is-in-pip");
          pipWindow.document.body.append(card);
          pipWindow.addEventListener("pagehide", () => {
            if (activePip === session) restorePip(session, false);
          }, { once: true });
          pipWindow.addEventListener("keydown", (event) => {
            if (event.key === "Escape") restorePip(session, true);
          });
          log("PIP表示を開始しました", card.dataset.widget);
        } catch (error) {
          if (activePip?.card === card) restorePip(activePip, false);
          reportError("PIPウィンドウを開けませんでした", error);
          showToast("PIPウィンドウを開けませんでした");
        }
      }

      let pendingMaximizeSession = null;

      function createWidgetPlaceholder(card, rect) {
        const placeholder = document.createElement("div");
        placeholder.className = "widget-placeholder";
        placeholder.setAttribute("aria-hidden", "true");
        const cardStyle = window.getComputedStyle(card);
        placeholder.style.setProperty("--placeholder-height", `${Math.max(1, rect.height)}px`);
        placeholder.style.order = cardStyle.order;
        placeholder.style.margin = cardStyle.margin;
        return placeholder;
      }

      function viewportSize() {
        const visual = window.visualViewport;
        return {
          width: Math.max(1, Math.round(visual?.width || window.innerWidth || document.documentElement.clientWidth)),
          height: Math.max(1, Math.round(visual?.height || window.innerHeight || document.documentElement.clientHeight))
        };
      }

      function prefersReducedMotion() {
        return Boolean(window.matchMedia?.("(prefers-reduced-motion: reduce)").matches);
      }

      function clearMaximizeCardStyles(card) {
        card.style.position = "";
        card.style.top = "";
        card.style.left = "";
        card.style.width = "";
        card.style.height = "";
        card.style.margin = "";
        card.style.transformOrigin = "";
        card.style.transform = "";
        card.style.borderRadius = "";
        card.style.transition = "";
        card.style.willChange = "";
      }

      function copyLiveControlValues(source, clone) {
        const sourceControls = source.querySelectorAll("input, textarea, select");
        const cloneControls = clone.querySelectorAll("input, textarea, select");
        sourceControls.forEach((control, index) => {
          const target = cloneControls[index];
          if (!target) return;
          if (control.type === "checkbox" || control.type === "radio") {
            target.checked = control.checked;
          } else {
            target.value = control.value;
          }
        });
      }

      function copyComputedStyles(source, clone) {
        const computed = window.getComputedStyle(source);
        for (let index = 0; index < computed.length; index += 1) {
          const property = computed.item(index);
          clone.style.setProperty(property, computed.getPropertyValue(property));
        }
        const sourceChildren = source.children;
        const cloneChildren = clone.children;
        for (let index = 0; index < sourceChildren.length; index += 1) {
          if (cloneChildren[index]) copyComputedStyles(sourceChildren[index], cloneChildren[index]);
        }
      }

      function createTransitionSnapshot(card, rect, borderRadius) {
        const snapshot = card.cloneNode(true);
        copyComputedStyles(card, snapshot);
        snapshot.classList.remove("is-maximized", "is-transition-hidden", "is-in-pip");
        snapshot.classList.add("widget-card--transition-snapshot");
        snapshot.removeAttribute("id");
        snapshot.querySelectorAll("[id]").forEach((node) => node.removeAttribute("id"));
        snapshot.setAttribute("aria-hidden", "true");
        snapshot.inert = true;
        copyLiveControlValues(card, snapshot);

        snapshot.style.position = "fixed";
        snapshot.style.top = "0";
        snapshot.style.left = "0";
        snapshot.style.width = `${Math.max(1, rect.width)}px`;
        snapshot.style.height = `${Math.max(1, rect.height)}px`;
        snapshot.style.margin = "0";
        snapshot.style.transformOrigin = "top left";
        snapshot.style.transform = `translate3d(${rect.left}px, ${rect.top}px, 0) scale(1, 1)`;
        snapshot.style.borderRadius = borderRadius;
        snapshot.style.opacity = "1";
        snapshot.style.pointerEvents = "none";
        snapshot.style.animation = "none";
        snapshot.style.transition = "none";
        return snapshot;
      }

      function runSnapshotAnimation(session, keyframes, duration = 570) {
        if (!session.snapshot || prefersReducedMotion() || typeof session.snapshot.animate !== "function") {
          return Promise.resolve();
        }
        try {
          const animation = session.snapshot.animate(keyframes, {
            duration,
            easing: "cubic-bezier(.22, 1, .36, 1)",
            fill: "forwards"
          });
          session.animation = animation;
          return animation.finished.catch(() => {});
        } catch (error) {
          reportError("全画面アニメーションを開始できません", error);
          return Promise.resolve();
        }
      }

      function revealCard(card) {
        card.classList.remove("is-transition-hidden");
        if (prefersReducedMotion() || typeof card.animate !== "function") return;
        try {
          card.animate(
            [{ opacity: 0 }, { opacity: 1 }],
            { duration: 145, easing: "ease-out" }
          );
        } catch (_) {}
      }

      function finishMaximizeRestore(session) {
        if (!session) return;
        if (session.animation) {
          try { session.animation.cancel(); } catch (_) {}
          session.animation = null;
        }
        session.snapshot?.remove();
        session.snapshot = null;

        clearMaximizeCardStyles(session.card);
        session.card.classList.remove("is-maximized", "is-transition-hidden");
        if (session.placeholder?.parentNode) {
          session.placeholder.replaceWith(session.card);
        }
        if (activeMaximize === session) activeMaximize = null;
        if (pendingMaximizeSession === session) pendingMaximizeSession = null;
        maximizeLayer.classList.remove("is-open", "is-closing");
        document.body.classList.remove("is-maximized");
        revealCard(session.card);
        log("全画面表示を終了しました", session.card.dataset.widget);
      }

      function restoreMaximize(immediate = false) {
        const session = activeMaximize;
        if (!session) return;

        activeMaximize = null;
        if (session.animation) {
          try { session.animation.cancel(); } catch (_) {}
          session.animation = null;
        }

        if (immediate || !session.placeholder?.isConnected || prefersReducedMotion()) {
          finishMaximizeRestore(session);
          return;
        }

        const viewport = viewportSize();
        const targetRect = session.placeholder.getBoundingClientRect();
        if (!targetRect.width || !targetRect.height) {
          finishMaximizeRestore(session);
          return;
        }

        pendingMaximizeSession = session;

        const fullRect = { left: 0, top: 0, width: viewport.width, height: viewport.height };
        const snapshot = createTransitionSnapshot(session.card, fullRect, "0px");
        snapshot.style.transform = "translate3d(0, 0, 0) scale(1, 1)";
        snapshot.style.borderRadius = "0px";
        session.snapshot = snapshot;
        maximizeLayer.append(snapshot);

        session.card.classList.add("is-transition-hidden");
        maximizeLayer.classList.remove("is-open");
        maximizeLayer.classList.add("is-closing");

        const scaleX = Math.max(.001, targetRect.width / viewport.width);
        const scaleY = Math.max(.001, targetRect.height / viewport.height);
        runSnapshotAnimation(session, [
          {
            transform: "translate3d(0, 0, 0) scale(1, 1)",
            borderRadius: "0px"
          },
          {
            transform: `translate3d(${targetRect.left}px, ${targetRect.top}px, 0) scale(${scaleX}, ${scaleY})`,
            borderRadius: session.borderRadius
          }
        ], 490).then(() => {
          if (pendingMaximizeSession === session) finishMaximizeRestore(session);
        });
      }

      function toggleMaximize(card) {
        if (pendingMaximizeSession) finishMaximizeRestore(pendingMaximizeSession);
        if (activePip?.card === card) restorePip(activePip, true);
        if (activeMaximize?.card === card) {
          restoreMaximize();
          return;
        }
        if (activeMaximize) restoreMaximize(true);

        const rect = card.getBoundingClientRect();
        if (!rect.width || !rect.height || !card.parentNode) {
          reportError("全画面表示の開始位置を取得できません", { width: rect.width, height: rect.height });
          return;
        }

        const borderRadius = window.getComputedStyle(card).borderRadius;
        const snapshot = !prefersReducedMotion() && typeof card.animate === "function"
          ? createTransitionSnapshot(card, rect, borderRadius)
          : null;
        const placeholder = createWidgetPlaceholder(card, rect);
        const session = {
          card,
          placeholder,
          borderRadius,
          snapshot,
          animation: null
        };

        card.parentNode.insertBefore(placeholder, card);
        maximizeLayer.append(card);
        activeMaximize = session;

        card.classList.add("is-maximized", "is-transition-hidden");
        document.getElementById("widget-strip")?.classList.add("is-arrived");
        document.body.classList.add("is-maximized");

        card.style.position = "fixed";
        card.style.top = "0";
        card.style.left = "0";
        card.style.width = "100vw";
        card.style.height = "100vh";
        card.style.height = "100dvh";
        card.style.margin = "0";
        card.style.transformOrigin = "top left";
        card.style.transform = "none";
        card.style.willChange = "opacity";
        card.style.transition = "none";
        card.style.borderRadius = "0px";

        maximizeLayer.classList.remove("is-closing");
        maximizeLayer.classList.add("is-open");

        if (snapshot) {
          maximizeLayer.append(snapshot);

          const viewport = viewportSize();
          const scaleX = Math.max(.001, viewport.width / rect.width);
          const scaleY = Math.max(.001, viewport.height / rect.height);
          runSnapshotAnimation(session, [
            {
              transform: `translate3d(${rect.left}px, ${rect.top}px, 0) scale(1, 1)`,
              borderRadius
            },
            {
              transform: `translate3d(0, 0, 0) scale(${scaleX}, ${scaleY})`,
              borderRadius: "0px"
            }
          ], 590).then(() => {
            if (activeMaximize !== session) return;
            session.snapshot?.remove();
            session.snapshot = null;
            session.animation = null;
            revealCard(card);
          });
        } else {
          revealCard(card);
        }

        log("カードを全画面表示しました", card.dataset.widget);
      }

      function resetTimeCard(card) {
        if (typeof card._workspaceTimeReset === "function") {
          card._workspaceTimeReset();
          return;
        }
        reportError("時間ツールのリセット処理が見つかりません");
      }

      /* Attach the shared window controls to each card itself. This is important:
         a card moved into a PIP document is no longer a descendant of `root`. */
      root.querySelectorAll(".widget-card").forEach((widgetCard) => {
        widgetCard.addEventListener("click", async (event) => {
          const button = event.target.closest("button");
          if (!button) return;
          const card = getCard(button);
          if (!card) return;

          const action = button.dataset.action;
          if (action === "pip") {
            await openPip(card);
            return;
          }
          if (action === "maximize") {
            toggleMaximize(card);
            return;
          }
          if (action === "copy") {
            const widget = card.dataset.widget;
            if (widget === "calculator") await copyText(getRole(card, "result")?.textContent, "計算結果をコピーしました");
            else if (widget === "color") await copyText(getRole(card, "color-hex")?.value, "カラーコードをコピーしました");
            return;
          }
          if (action === "clear") {
            if (card.dataset.widget === "calculator") clearCalculator(card);
            if (card.dataset.widget === "memo") clearMemo(card);
            return;
          }
          if (action === "random-color") {
            const input = getRole(card, "color-input");
            if (input) {
              const hex = `#${Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, "0")}`;
              input.value = hex;
              updateColor(card, hex);
              log("ランダムカラーを生成しました", hex);
            }
            return;
          }
          if (action === "reset-time") {
            resetTimeCard(card);
            return;
          }
          if (action === "time-toggle") {
            if (typeof card._workspaceTimeToggle === "function") card._workspaceTimeToggle();
            else reportError("時間ツールの開始／停止処理が見つかりません");
            return;
          }
          if (action === "pick-color") {
            const input = getRole(card, "color-input");
            if (input) input.click();
            return;
          }
          if (action === "focus-memo") {
            if (typeof card._workspaceNewMemo === "function") card._workspaceNewMemo();
            else reportError("メモ作成処理が見つかりません");
            return;
          }
        });
      });

      maximizeLayer.addEventListener("click", (event) => {
        if (event.target === maximizeLayer) restoreMaximize();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && activeMaximize) {
          restoreMaximize();
          return;
        }
        if (event.target.closest?.("input, textarea, button")) return;
        const calculator = root.querySelector('[data-widget="calculator"]');
        if (!calculator || activePip?.card === calculator || activeMaximize?.card === calculator) return;
        const allowed = /^[0-9.+\-*/()%]$/;
        if (allowed.test(event.key)) {
          event.preventDefault();
          appendCalculatorInput(calculator, event.key);
        } else if (event.key === "Enter" || event.key === "=") {
          event.preventDefault();
          calculate(calculator);
        } else if (event.key === "Backspace") {
          event.preventDefault();
          backspaceCalculator(calculator);
        } else if (event.key === "Escape") {
          clearCalculator(calculator);
        }
      });

      /* Calculator: recursive-descent parser; no eval or Function constructor. */
      function evaluateExpression(source) {
        const compact = source.replace(/\s+/g, "");
        const tokens = compact.match(/(?:\d+(?:\.\d*)?|\.\d+)|[()+\-*/%]/g) || [];
        if (!compact || tokens.join("") !== compact) throw new Error("式を確認してください");
        let position = 0;
        const peek = () => tokens[position];
        const take = () => tokens[position++];

        function primary() {
          const token = take();
          if (token === "(") {
            const value = expression();
            if (take() !== ")") throw new Error("括弧が閉じられていません");
            return value;
          }
          if (token === undefined || !/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(token)) {
            throw new Error("数値を入力してください");
          }
          return Number(token);
        }
        function unary() {
          if (peek() === "+") { take(); return unary(); }
          if (peek() === "-") { take(); return -unary(); }
          let value = primary();
          while (peek() === "%") { take(); value /= 100; }
          return value;
        }
        function term() {
          let value = unary();
          while (peek() === "*" || peek() === "/") {
            const operator = take();
            const right = unary();
            if (operator === "/" && right === 0) throw new Error("0で割ることはできません");
            value = operator === "*" ? value * right : value / right;
          }
          return value;
        }
        function expression() {
          let value = term();
          while (peek() === "+" || peek() === "-") {
            const operator = take();
            const right = term();
            value = operator === "+" ? value + right : value - right;
          }
          return value;
        }
        const result = expression();
        if (position !== tokens.length || !Number.isFinite(result)) throw new Error("式を確認してください");
        return Number.parseFloat(result.toPrecision(12)).toString();
      }

      function renderCalculator(card, expression, result, status = "Ready") {
        const expressionNode = getRole(card, "expression");
        const resultNode = getRole(card, "result");
        const statusNode = getRole(card, "calc-status");
        if (expressionNode) expressionNode.textContent = expression || "\u00a0";
        if (resultNode) resultNode.textContent = result;
        if (statusNode) statusNode.textContent = status;
        card.dataset.expression = expression;
        card.dataset.result = result;
      }
      function appendCalculatorInput(card, value) {
        let expression = card.dataset.expression || "";
        if (card.dataset.justEvaluated === "true") {
          if (/^[0-9.(]$/.test(value)) expression = "";
          else if (/^[+*/%-]$/.test(value)) expression = card.dataset.result || expression;
        }
        card.dataset.justEvaluated = "false";
        expression += value;
        renderCalculator(card, expression, expression || "0");
      }
      function clearCalculator(card) {
        card.dataset.justEvaluated = "false";
        renderCalculator(card, "", "0", "Cleared");
        log("計算機をクリアしました");
      }
      function backspaceCalculator(card) {
        const expression = (card.dataset.expression || "").slice(0, -1);
        card.dataset.justEvaluated = "false";
        renderCalculator(card, expression, expression || "0");
      }
      function calculate(card) {
        const expression = card.dataset.expression || "";
        if (!expression) return;
        try {
          const result = evaluateExpression(expression);
          card.dataset.justEvaluated = "true";
          renderCalculator(card, expression, result, "Calculated");
          log("計算しました", { expression, result });
        } catch (error) {
          renderCalculator(card, expression, "Error", "入力エラー");
          reportError("計算式を評価できません", error);
        }
      }
      const calculatorCard = root.querySelector('[data-widget="calculator"]');
      if (!calculatorCard) reportError("計算機カードが見つかりません");
      else {
        calculatorCard.addEventListener("click", (event) => {
          const key = event.target.closest("[data-calc]");
          if (!key) return;
          const value = key.dataset.calc;
          if (value === "clear") clearCalculator(calculatorCard);
          else if (value === "backspace") backspaceCalculator(calculatorCard);
          else if (value === "=") calculate(calculatorCard);
          else appendCalculatorInput(calculatorCard, value);
        });
        log("計算機を初期化しました");
      }

      /* Stopwatch and countdown timer */
      const timeCard = root.querySelector('[data-widget="time"]');
      if (!timeCard) reportError("時間ツールカードが見つかりません");
      else initializeTimeTools(timeCard);

      function formatStopwatch(milliseconds) {
        const totalCentiseconds = Math.floor(milliseconds / 10);
        const minutes = Math.floor(totalCentiseconds / 6000);
        const seconds = Math.floor((totalCentiseconds % 6000) / 100);
        const centiseconds = totalCentiseconds % 100;
        return `${String(minutes).padStart(2, "0")} ${String(seconds).padStart(2, "0")} ${String(centiseconds).padStart(2, "0")}`;
      }
      function formatTimer(milliseconds) {
        const totalSeconds = Math.max(0, Math.ceil(milliseconds / 1000));
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        return `${String(hours).padStart(2, "0")} ${String(minutes).padStart(2, "0")} ${String(seconds).padStart(2, "0")}`;
      }
      function initializeTimeTools(card) {
        const state = {
          mode: "stopwatch",
          stopwatchRunning: false,
          stopwatchStartedAt: 0,
          stopwatchElapsed: 0,
          stopwatchInterval: null,
          laps: [],
          timerRunning: false,
          timerDeadline: 0,
          timerRemaining: 0,
          timerInitial: 0,
          timerInterval: null
        };
        const stopwatchDisplay = getRole(card, "stopwatch-display");
        const timerDisplay = getRole(card, "timer-display");
        const status = getRole(card, "time-status");
        const lapsNode = getRole(card, "laps");
        const timerProgress = getRole(card, "timer-progress");
        const startStopwatch = card.querySelector('[data-stopwatch="toggle"]');
        const lapButton = card.querySelector('[data-stopwatch="lap"]');
        const timerToggle = card.querySelector('[data-timer="toggle"]');
        const headerToggle = card.querySelector('[data-action="time-toggle"]');

        function setStatus(value) { if (status) status.textContent = value; }
        function syncHeaderToggle() {
          if (!headerToggle) return;
          const running = state.mode === "timer" ? state.timerRunning : state.stopwatchRunning;
          const icon = getRole(card, "time-toggle-icon");
          if (icon) {
            icon.innerHTML = running
              ? '<path d="M6 4.5h3.2v11H6zM11 4.5h3.2v11H11z" fill="currentColor" stroke="none" />'
              : '<path d="M6.5 4.5 16 10l-9.5 5.5z" fill="currentColor" stroke="none" />';
          }
          headerToggle.setAttribute("aria-label", running ? "一時停止" : "スタート");
          headerToggle.title = running ? "一時停止" : "スタート";
        }
        function elapsedStopwatch() {
          return state.stopwatchElapsed + (state.stopwatchRunning ? performance.now() - state.stopwatchStartedAt : 0);
        }
        function updateStopwatch() {
          if (stopwatchDisplay) stopwatchDisplay.innerHTML = formatStopwatch(elapsedStopwatch());
        }
        function stopStopwatchInterval() {
          if (state.stopwatchInterval !== null) window.clearInterval(state.stopwatchInterval);
          state.stopwatchInterval = null;
        }
        function resetStopwatch() {
          stopStopwatchInterval();
          state.stopwatchRunning = false;
          state.stopwatchElapsed = 0;
          state.laps = [];
          if (lapsNode) lapsNode.replaceChildren();
          if (startStopwatch) startStopwatch.textContent = "スタート";
          if (lapButton) lapButton.disabled = true;
          updateStopwatch();
          syncHeaderToggle();
          setStatus("停止中");
          log("ストップウォッチをリセットしました");
        }
        function toggleStopwatch() {
          if (!state.stopwatchRunning) {
            state.stopwatchRunning = true;
            state.stopwatchStartedAt = performance.now();
            if (startStopwatch) startStopwatch.textContent = "ストップ";
            if (lapButton) lapButton.disabled = false;
            syncHeaderToggle();
            setStatus("計測中");
            state.stopwatchInterval = window.setInterval(updateStopwatch, 30);
            log("ストップウォッチを開始しました");
          } else {
            state.stopwatchElapsed = elapsedStopwatch();
            state.stopwatchRunning = false;
            stopStopwatchInterval();
            if (startStopwatch) startStopwatch.textContent = "再開";
            syncHeaderToggle();
            setStatus("一時停止中");
            updateStopwatch();
            log("ストップウォッチを停止しました");
          }
        }
        function addLap() {
          if (!state.stopwatchRunning) return;
          const elapsed = elapsedStopwatch();
          const previous = state.laps.at(-1) || 0;
          state.laps.push(elapsed);
          if (!lapsNode) return;
          const item = document.createElement("li");
          const label = document.createElement("span");
          const value = document.createElement("span");
          label.textContent = `ラップ ${state.laps.length}`;
          value.textContent = `+${formatStopwatch(elapsed - previous).replace(/<small>|<\/small>/g, "")}`;
          item.append(label, value);
          lapsNode.prepend(item);
          log("ラップを記録しました", state.laps.length);
        }

        function readTimerInput() {
          const read = (name, max) => {
            const input = card.querySelector(`[data-timer-input="${name}"]`);
            if (!input) { reportError(`タイマー入力欄がありません: ${name}`); return 0; }
            const value = Number.parseInt(input.value, 10);
            const normalized = Number.isFinite(value) ? Math.min(max, Math.max(0, value)) : 0;
            input.value = String(normalized);
            return normalized;
          };
          return (read("hours", 99) * 3600 + read("minutes", 59) * 60 + read("seconds", 59)) * 1000;
        }
        function stopTimerInterval() {
          if (state.timerInterval !== null) window.clearInterval(state.timerInterval);
          state.timerInterval = null;
        }
        function updateTimer() {
          const remaining = Math.max(0, state.timerDeadline - Date.now());
          state.timerRemaining = remaining;
          if (timerDisplay) timerDisplay.innerHTML = formatTimer(remaining);
          if (timerProgress) {
            const percent = state.timerInitial > 0 ? (1 - remaining / state.timerInitial) * 100 : 0;
            timerProgress.style.width = `${Math.min(100, Math.max(0, percent))}%`;
          }
          if (remaining <= 0 && state.timerRunning) {
            state.timerRunning = false;
            stopTimerInterval();
            if (timerToggle) timerToggle.textContent = "スタート";
            syncHeaderToggle();
            setStatus("時間になりました");
            showToast("タイマーが終了しました");
            log("タイマーが終了しました");
          }
        }
        function resetTimer() {
          stopTimerInterval();
          state.timerRunning = false;
          state.timerRemaining = readTimerInput();
          state.timerInitial = state.timerRemaining;
          if (timerToggle) timerToggle.textContent = "スタート";
          updateTimer();
          syncHeaderToggle();
          setStatus("停止中");
          log("タイマーをリセットしました");
        }
        function toggleTimer() {
          if (!state.timerRunning) {
            const selected = state.timerRemaining > 0 ? state.timerRemaining : readTimerInput();
            if (selected <= 0) {
              showToast("時間を設定してください");
              return;
            }
            state.timerRemaining = selected;
            if (state.timerInitial <= 0 || state.timerRemaining === readTimerInput()) state.timerInitial = selected;
            state.timerDeadline = Date.now() + selected;
            state.timerRunning = true;
            if (timerToggle) timerToggle.textContent = "一時停止";
            syncHeaderToggle();
            setStatus("カウントダウン中");
            state.timerInterval = window.setInterval(updateTimer, 100);
            updateTimer();
            log("タイマーを開始しました", selected);
          } else {
            state.timerRemaining = Math.max(0, state.timerDeadline - Date.now());
            state.timerRunning = false;
            stopTimerInterval();
            if (timerToggle) timerToggle.textContent = "再開";
            updateTimer();
            syncHeaderToggle();
            setStatus("一時停止中");
            log("タイマーを一時停止しました");
          }
        }

        card.addEventListener("click", (event) => {
          const stopwatchSurface = event.target.closest('[data-role="stopwatch-display"]');
          if (stopwatchSurface) {
            addLap();
            return;
          }
          const modeButton = event.target.closest("[data-time-mode]");
          if (modeButton) {
            state.mode = modeButton.dataset.timeMode;
            card.dataset.timeMode = state.mode;
            card.querySelectorAll("[data-time-mode]").forEach((button) => button.setAttribute("aria-pressed", String(button === modeButton)));
            card.querySelectorAll("[data-time-panel]").forEach((panel) => { panel.hidden = panel.dataset.timePanel !== state.mode; });
            setStatus(state.mode === "timer" ? "タイマー" : "ストップウォッチ");
            syncHeaderToggle();
            log("時間ツールのモードを変更しました", state.mode);
            return;
          }
          const stopwatchAction = event.target.closest("[data-stopwatch]")?.dataset.stopwatch;
          if (stopwatchAction === "toggle") toggleStopwatch();
          else if (stopwatchAction === "lap") addLap();
          else if (stopwatchAction === "reset") resetStopwatch();
          const timerAction = event.target.closest("[data-timer]")?.dataset.timer;
          if (timerAction === "toggle") toggleTimer();
          else if (timerAction === "reset") resetTimer();
        });
        card.addEventListener("keydown", (event) => {
          if (event.target.matches('[data-role="stopwatch-display"]') && (event.key === "Enter" || event.key === " ")) {
            event.preventDefault();
            addLap();
          }
        });
        card.addEventListener("change", (event) => {
          if (event.target.matches("[data-timer-input]") && !state.timerRunning) resetTimer();
        });

        card._workspaceTimeReset = () => state.mode === "timer" ? resetTimer() : resetStopwatch();
        card._workspaceTimeToggle = () => state.mode === "timer" ? toggleTimer() : toggleStopwatch();
        resetStopwatch();
        resetTimer();
      }

      /* Color picker: editable HEX field is the visible color value. */
      const colorCard = root.querySelector('[data-widget="color"]');
      function updateColor(card, rawValue) {
        const hex = String(rawValue || "").trim().toUpperCase();
        if (!/^#[0-9A-F]{6}$/.test(hex)) return false;
        const colorInput = getRole(card, "color-input");
        const hexInput = getRole(card, "color-hex");
        const caption = card.querySelector(".color-caption");
        const rgbNode = getRole(card, "color-rgb");
        const red = Number.parseInt(hex.slice(1, 3), 16);
        const green = Number.parseInt(hex.slice(3, 5), 16);
        const blue = Number.parseInt(hex.slice(5, 7), 16);
        if (colorInput) colorInput.value = hex.toLowerCase();
        if (hexInput && hexInput.value !== hex) hexInput.value = hex;
        card.style.backgroundColor = hex;
        const luminance = .2126 * (red / 255) + .7152 * (green / 255) + .0722 * (blue / 255);
        const foreground = luminance > .58 ? "#050505" : "#ffffff";
        if (hexInput) hexInput.style.color = foreground;
        if (caption) caption.style.color = foreground;
        if (rgbNode) rgbNode.textContent = `rgb(${red}, ${green}, ${blue})`;
        return true;
      }
      if (!colorCard) reportError("カラーピッカーカードが見つかりません");
      else {
        const colorInput = getRole(colorCard, "color-input");
        const hexInput = getRole(colorCard, "color-hex");
        if (!colorInput || !hexInput) {
          reportError("カラーピッカーの入力要素が不足しています");
        } else {
          colorInput.addEventListener("input", () => updateColor(colorCard, colorInput.value));
          hexInput.addEventListener("input", () => {
            if (/^#[0-9A-Fa-f]{6}$/.test(hexInput.value.trim())) updateColor(colorCard, hexInput.value);
          });
          hexInput.addEventListener("change", () => {
            if (!updateColor(colorCard, hexInput.value)) {
              showToast("HEXは #RRGGBB の形式で入力してください");
              hexInput.value = colorInput.value.toUpperCase();
            }
          });
          hexInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") hexInput.blur();
          });
          updateColor(colorCard, colorInput.value || "#00ff88");
          log("カラーピッカーを初期化しました");
        }
      }

      /* Memo list: each note has an independent title and body. */
      const memoCard = root.querySelector('[data-widget="memo"]');
      function initializeMemo(card) {
        const list = getRole(card, "memo-list");
        const empty = getRole(card, "memo-empty");
        const editor = getRole(card, "memo-editor");
        const titleInput = getRole(card, "memo-title");
        const bodyInput = getRole(card, "memo-body");
        const status = getRole(card, "memo-status");
        const deleteButton = card.querySelector('[data-memo-action="delete"]');
        if (!list || !empty || !editor || !titleInput || !bodyInput || !deleteButton) {
          reportError("メモ一覧に必要な要素が見つかりません");
          return;
        }

        let notes = [];
        let editingId = null;
        try {
          const savedNotes = safeStorage.get(STORAGE_KEYS.memoNotes, "");
          if (savedNotes) {
            const parsed = JSON.parse(savedNotes);
            if (Array.isArray(parsed)) {
              notes = parsed.filter((note) => note && typeof note === "object")
                .map((note) => ({
                  id: String(note.id || createMemoId()),
                  title: String(note.title || "無題").slice(0, 100),
                  body: String(note.body || "")
                }));
            }
          } else {
            const legacyText = safeStorage.get(STORAGE_KEYS.memo, "");
            if (legacyText.trim()) {
              notes = [{ id: createMemoId(), title: "メモ", body: legacyText }];
              safeStorage.set(STORAGE_KEYS.memoNotes, JSON.stringify(notes));
              log("旧形式のメモをタイトル・本文形式に移行しました");
            }
          }
        } catch (error) {
          reportError("保存済みメモを読み込めません", error);
          notes = [];
        }

        function createMemoId() {
          if (window.crypto?.randomUUID) return window.crypto.randomUUID();
          return `memo-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
        }

        function persist(nextNotes) {
          const saved = safeStorage.set(STORAGE_KEYS.memoNotes, JSON.stringify(nextNotes));
          if (status) status.textContent = saved ? "保存済み" : "保存できません";
          if (!saved) return false;
          notes = nextNotes;
          log("メモ一覧を保存しました", { count: notes.length });
          renderList();
          return true;
        }

        function renderList() {
          const fragment = document.createDocumentFragment();
          for (const note of notes) {
            const item = document.createElement("button");
            item.type = "button";
            item.className = "memo-item";
            item.dataset.memoId = note.id;
            item.setAttribute("aria-label", `${note.title}を編集`);

            const title = document.createElement("span");
            title.className = "memo-item-title";
            title.textContent = note.title || "無題";

            const preview = document.createElement("span");
            preview.className = "memo-item-preview";
            preview.textContent = note.body.trim() || "本文なし";

            item.append(title, preview);
            fragment.append(item);
          }
          list.replaceChildren(fragment);
          list.hidden = notes.length === 0;
          empty.hidden = notes.length !== 0;
        }

        function closeEditor() {
          editor.hidden = true;
          editingId = null;
          titleInput.value = "";
          bodyInput.value = "";
          deleteButton.hidden = true;
          renderList();
        }

        function openEditor(noteId = null) {
          const note = noteId ? notes.find((entry) => entry.id === noteId) : null;
          if (noteId && !note) {
            reportError("編集対象のメモが見つかりません", noteId);
            return;
          }
          editingId = note?.id || null;
          titleInput.value = note?.title || "";
          bodyInput.value = note?.body || "";
          deleteButton.hidden = !note;
          list.hidden = true;
          empty.hidden = true;
          editor.hidden = false;
          titleInput.focus();
          log(note ? "メモを編集します" : "新しいメモを作成します");
        }

        function saveEditor() {
          const title = titleInput.value.trim();
          const body = bodyInput.value;
          if (!title) {
            showToast("タイトルを入力してください");
            titleInput.focus();
            return;
          }
          let nextNotes;
          if (editingId) {
            nextNotes = notes.map((note) => note.id === editingId ? { ...note, title, body } : note);
          } else {
            nextNotes = [{ id: createMemoId(), title, body }, ...notes];
          }
          if (persist(nextNotes)) closeEditor();
        }

        function deleteEditingNote() {
          if (!editingId) return;
          const nextNotes = notes.filter((note) => note.id !== editingId);
          if (persist(nextNotes)) {
            closeEditor();
            showToast("メモを削除しました");
          }
        }

        card.addEventListener("click", (event) => {
          const noteButton = event.target.closest("[data-memo-id]");
          if (noteButton && card.contains(noteButton)) {
            openEditor(noteButton.dataset.memoId);
            return;
          }
          const actionButton = event.target.closest("[data-memo-action]");
          if (!actionButton || !card.contains(actionButton)) return;
          const action = actionButton.dataset.memoAction;
          if (action === "save") saveEditor();
          else if (action === "cancel") closeEditor();
          else if (action === "delete") deleteEditingNote();
        });

        card._workspaceNewMemo = () => openEditor();
        card._workspaceClearMemo = () => {
          if (persist([])) {
            closeEditor();
            log("すべてのメモを消去しました");
          }
        };
        renderList();
      }

      function clearMemo(card) {
        if (typeof card._workspaceClearMemo === "function") card._workspaceClearMemo();
        else reportError("メモの初期化処理が見つかりません");
      }
      if (!memoCard) reportError("メモカードが見つかりません");
      else {
        initializeMemo(memoCard);
        log("メモ一覧を初期化しました");
      }

      /* Calendar: local date keys avoid UTC date-shift issues. */
      const calendarCard = root.querySelector('[data-widget="calendar"]');
      function localDateKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }
      function parseDateKey(key) {
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key);
        if (!match) return null;
        const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
        return Number.isNaN(date.getTime()) ? null : date;
      }
      function initializeCalendar(card) {
        const now = new Date();
        const state = {
          month: new Date(now.getFullYear(), now.getMonth(), 1),
          selected: new Date(now.getFullYear(), now.getMonth(), now.getDate()),
          events: {}
        };
        const monthNode = getRole(card, "calendar-month");
        const yearNode = getRole(card, "calendar-year");
        const grid = getRole(card, "calendar-grid");
        const selectedNode = getRole(card, "calendar-selected-date");
        const eventInput = getRole(card, "calendar-event-input");
        const status = getRole(card, "calendar-status");
        const weekdayNames = ["月", "火", "水", "木", "金", "土", "日"];

        try {
          const parsed = JSON.parse(safeStorage.get(STORAGE_KEYS.calendar, "{}"));
          if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
            state.events = Object.fromEntries(Object.entries(parsed).filter(([key, value]) => /^\d{4}-\d{2}-\d{2}$/.test(key) && typeof value === "string"));
          }
        } catch (error) {
          reportError("カレンダーの保存データが壊れています。空の予定表で起動します", error);
          state.events = {};
        }

        function formatSelected(date) {
          const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
          return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日（${weekdays[date.getDay()]}）`;
        }
        function saveEvents() {
          const saved = safeStorage.set(STORAGE_KEYS.calendar, JSON.stringify(state.events));
          if (status) status.textContent = saved ? "この端末に保存" : "保存できません";
          if (saved) log("カレンダーの予定を保存しました");
          return saved;
        }
        function updateSelected() {
          const key = localDateKey(state.selected);
          if (selectedNode) selectedNode.textContent = formatSelected(state.selected);
          if (eventInput) eventInput.value = state.events[key] || "";
        }
        function render() {
          if (!grid || !monthNode || !yearNode) return;
          monthNode.textContent = `${state.month.getMonth() + 1}月`;
          yearNode.textContent = String(state.month.getFullYear());
          const firstDay = new Date(state.month.getFullYear(), state.month.getMonth(), 1);
          const daysInMonth = new Date(state.month.getFullYear(), state.month.getMonth() + 1, 0).getDate();
          const offset = (firstDay.getDay() + 6) % 7;
          const cellCount = Math.ceil((offset + daysInMonth) / 7) * 7;
          const todayKey = localDateKey(new Date());
          const selectedKey = localDateKey(state.selected);
          const fragment = document.createDocumentFragment();

          weekdayNames.forEach((name) => {
            const heading = document.createElement("div");
            heading.className = "calendar-weekday";
            heading.textContent = name;
            fragment.append(heading);
          });
          for (let index = 0; index < cellCount; index += 1) {
            const date = new Date(state.month.getFullYear(), state.month.getMonth(), 1 - offset + index);
            const key = localDateKey(date);
            const day = document.createElement("button");
            day.type = "button";
            day.className = "calendar-day";
            day.dataset.date = key;
            day.textContent = String(date.getDate());
            day.setAttribute("aria-label", formatSelected(date));
            if (date.getMonth() !== state.month.getMonth()) day.classList.add("outside");
            if (key === todayKey) day.classList.add("today");
            if (key === selectedKey) day.classList.add("selected");
            if (state.events[key]) day.classList.add("has-event");
            fragment.append(day);
          }
          grid.replaceChildren(fragment);
          updateSelected();
        }
        function shiftMonth(amount) {
          state.month = new Date(state.month.getFullYear(), state.month.getMonth() + amount, 1);
          render();
          log("カレンダーの月を変更しました", localDateKey(state.month));
        }
        card.addEventListener("click", (event) => {
          const day = event.target.closest("[data-date]");
          if (day) {
            const date = parseDateKey(day.dataset.date);
            if (!date) { reportError("カレンダーの日付を読み取れません", day.dataset.date); return; }
            state.selected = date;
            state.month = new Date(date.getFullYear(), date.getMonth(), 1);
            render();
            return;
          }
          const action = event.target.closest("[data-calendar]")?.dataset.calendar;
          if (action === "previous") shiftMonth(-1);
          else if (action === "next") shiftMonth(1);
          else if (action === "today") {
            const today = new Date();
            state.month = new Date(today.getFullYear(), today.getMonth(), 1);
            state.selected = today;
            render();
          } else if (action === "save") {
            if (!eventInput) return;
            const key = localDateKey(state.selected);
            const value = eventInput.value.trim();
            if (value) state.events[key] = value;
            else delete state.events[key];
            saveEvents();
            render();
            showToast(value ? "予定を保存しました" : "予定を削除しました");
          } else if (action === "delete") {
            const key = localDateKey(state.selected);
            delete state.events[key];
            if (eventInput) eventInput.value = "";
            saveEvents();
            render();
            showToast("予定を削除しました");
          }
        });
        render();
        log("カレンダーを初期化しました");
      }
      if (!calendarCard) reportError("カレンダーカードが見つかりません");
      else initializeCalendar(calendarCard);

      log("Workspaceを初期化しました", {
        widgets: root.querySelectorAll(".widget-card").length,
        pictureInPicture: "documentPictureInPicture" in window,
        secureContext: window.isSecureContext
      });
    })();
  </script>

  <div class="widget-strip" id="widget-strip" role="group" aria-label="時計、日付、バッテリー">
    <section class="widget-strip__pill widget-strip__pill--clock" aria-label="現在時刻">
      <div class="widget-strip__clock-emblem" aria-hidden="true">
        <span class="widget-strip__clock-base"></span>
        <span class="widget-strip__clock-mask widget-strip__clock-mask--minute"><span class="widget-strip__clock-paint"></span></span>
        <span class="widget-strip__clock-mask widget-strip__clock-mask--hour"><span class="widget-strip__clock-paint"></span></span>
        <span class="widget-strip__clock-mask widget-strip__clock-mask--second"><span class="widget-strip__clock-paint"></span></span>
      </div>
      <time class="widget-strip__clock-text" id="widgetStripClockText">
        <span id="widgetStripHours">--</span> <span class="widget-strip__clock-minute" id="widgetStripMinutes">--</span>
      </time>
    </section>

    <section class="widget-strip__pill widget-strip__pill--calendar" aria-label="今日の日付">
      <div class="widget-strip__calendar-emblem" aria-hidden="true">
        <span class="widget-strip__calendar-glow"></span>
      </div>
      <time class="widget-strip__calendar-text" id="widgetStripCalendarText">
        <span id="widgetStripWeekday">---</span><span class="widget-strip__calendar-day" id="widgetStripDay">--</span>
      </time>
    </section>

    <section class="widget-strip__pill widget-strip__pill--value" aria-label="バッテリー残量75パーセント">
      <span class="widget-strip__value-fill" aria-hidden="true"></span>
      <span class="widget-strip__value-text">75</span>
    </section>
  </div>

  <script>
    (() => {
      "use strict";

      const widgetStrip = document.getElementById("widget-strip");
      const clockText = document.getElementById("widgetStripClockText");
      const hoursText = document.getElementById("widgetStripHours");
      const minutesText = document.getElementById("widgetStripMinutes");
      const calendarText = document.getElementById("widgetStripCalendarText");
      const weekdayText = document.getElementById("widgetStripWeekday");
      const dayText = document.getElementById("widgetStripDay");

      if (![widgetStrip, clockText, hoursText, minutesText, calendarText, weekdayText, dayText].every(Boolean)) {
        console.error("[WidgetStrip] 必要な要素が見つかりません。");
        return;
      }

      widgetStrip.addEventListener("animationend", (event) => {
        if (event.animationName === "widget-dock-arrive") widgetStrip.classList.add("is-arrived");
      }, { once: true });

      const weekdayFormatter = new Intl.DateTimeFormat("en-US", { weekday: "short" });
      let intervalId = 0;
      let lastCalendarKey = "";
      const pad2 = (value) => String(value).padStart(2, "0");

      function updateWidgetStrip() {
        const now = new Date();
        const hour = now.getHours();
        const minute = now.getMinutes();
        const second = now.getSeconds() + now.getMilliseconds() / 1000;

        const hourAngle = ((hour % 12) + minute / 60 + second / 3600) * 30;
        const minuteAngle = (minute + second / 60) * 6;
        const secondAngle = second * 6;

        widgetStrip.style.setProperty("--clock-hour-gradient-angle", `${hourAngle}deg`);
        widgetStrip.style.setProperty("--clock-minute-gradient-angle", `${minuteAngle}deg`);
        widgetStrip.style.setProperty("--clock-second-gradient-angle", `${secondAngle}deg`);

        const hoursValue = pad2(hour);
        const minutesValue = pad2(minute);
        hoursText.textContent = hoursValue;
        minutesText.textContent = minutesValue;
        clockText.dateTime = [
          now.getFullYear(), pad2(now.getMonth() + 1), pad2(now.getDate())
        ].join("-") + `T${hoursValue}:${minutesValue}:${pad2(now.getSeconds())}`;

        const calendarKey = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
        if (calendarKey !== lastCalendarKey) {
          widgetStrip.style.setProperty("--calendar-month-angle", `${now.getMonth() * 30}deg`);
          weekdayText.textContent = weekdayFormatter.format(now);
          dayText.textContent = String(now.getDate());
          calendarText.dateTime = [
            now.getFullYear(), pad2(now.getMonth() + 1), pad2(now.getDate())
          ].join("-");
          lastCalendarKey = calendarKey;
        }
      }

      function startClock() {
        if (intervalId) window.clearInterval(intervalId);
        updateWidgetStrip();
        intervalId = window.setInterval(updateWidgetStrip, 100);
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          if (intervalId) window.clearInterval(intervalId);
          intervalId = 0;
        } else {
          startClock();
        }
      });

      startClock();
    })();
  </script>
