<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:opsz,wght@12..36,300..900&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#f4f5f7">
  <link rel="stylesheet" href="https://search3958.github.io/frameworks/icons/icons.css">
  <title>ToolBoard</title>
  <style id="app-styles">
    :root {
      color-scheme: light;
      --page-bg: #F1F1F3;
      --surface: #ffffff;
      --text: #08090b;
      --muted: #a5a7ad;
      --accent: #00f58a;
      --green: #00f58a;
      --key: #eeeeF0;
      --key-dark: #d5d8de;
      font-family: "TikTok Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--page-bg); scrollbar-gutter: stable; }
    body.is-maximized { overflow: hidden; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--page-bg);
      color: var(--text);
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }

    .main-container {
      width: min(668px, calc(100% - 32px));
      margin: 0 auto;
      padding: 37px 0 48px;
    }
    .dashboard-heading {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 0 32px;
      text-align: center;
    }
    .dashboard-heading h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.25;
      font-weight: 680;
      letter-spacing: -.045em;
    }
    .profile-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }
    .profile-link {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #08090b;
      font-size: 21px;
      font-weight: 450;
      letter-spacing: -.035em;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      transition: background .2s ease, transform .2s cubic-bezier(.2,.8,.2,1);
    }
    a.profile-link:hover { background: #e5e5e8; transform: translateY(-1px); }
    a.profile-link:active { transform: scale(.97); }

    .dashboard-masonry {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
      column-gap: 28px;
    }
    .dashboard-column {
      display: grid;
      min-width: 0;
      align-content: start;
      gap: 28px;
    }
    .dashboard-column-right { gap: 36px; }
    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
    .widget-card {
      position: relative;
      display: flex;
      width: 100%;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
      border: 0;
      border-radius: 42px;
      corner-shape: superellipse(1.6);
      background: var(--surface);
      box-shadow: none;
      animation: card-arrive .72s cubic-bezier(.2,.8,.2,1) both;
      transform-origin: 50% 35%;
      transition: transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease;
      break-inside: avoid;
    }
    .dashboard-column-left .widget-card:nth-child(1) { animation-delay: .04s; }
    .dashboard-column-left .widget-card:nth-child(2) { animation-delay: .16s; }
    .dashboard-column-left .widget-card:nth-child(3) { animation-delay: .28s; }
    .dashboard-column-right .widget-card:nth-child(1) { animation-delay: .10s; }
    .dashboard-column-right .widget-card:nth-child(2) { animation-delay: .22s; }
    @keyframes card-arrive {
      from { opacity: 0; transform: translateY(18px) scale(.975); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .widget-header {
      position: absolute;
      z-index: 2;
      top: 12px;
      right: 14px;
      left: 16px;
      display: flex;
      min-height: 28px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0;
      border: 0;
      background: transparent;
    }
    .window-controls, .widget-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
    }
    .window-controls {
      height: 24px;
      gap: 0;
      padding: 0 3px;
      border-radius: 999px;
      background: rgba(229, 230, 233, .88);
    }
    .icon-button {
      display: inline-grid;
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #b8bac2;
      cursor: pointer;
      transition: color .18s ease, background .18s ease, transform .22s cubic-bezier(.2,.8,.2,1), opacity .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-button:active { transform: scale(.84); }
    .icon-button:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 2px solid #1d8cff;
      outline-offset: 3px;
    }
    .icon-button svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .window-controls .icon-button {
      position: relative;
      width: 17px;
      height: 24px;
      border-radius: 0;
      color: transparent;
    }
    .window-controls .icon-button::after {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #a7a9af;
      content: "";
      transition: transform .18s ease, background .18s ease;
    }
    .window-controls .icon-button:first-child::after { background: #a3a5ac; }
    .window-controls .icon-button:last-child::after { background: #92959d; }
    .window-controls .icon-button:hover::after { background: #70747c; transform: scale(1.1); }
    .widget-heading { display: none; }
    .widget-body {
      position: relative;
      display: flex;
      min-width: 0;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      padding: 16px;
    }
    .widget-footer { display: none; }
    .muted { color: var(--muted); }

    /* Calculator */
    .widget-card[data-widget="calculator"] { height: 320px; }
    .widget-card[data-widget="calculator"] .widget-body { padding: 47px 16px 14px; }
    .calculator-display {
      position: relative;
      display: flex;
      min-height: 64px;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
      overflow: hidden;
      padding: 3px 2px 9px;
    }
    .calculator-expression {
      width: 100%;
      min-height: 34px;
      overflow: hidden;
      color: #090a0b;
      font-size: 28px;
      font-weight: 450;
      letter-spacing: -.055em;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .calculator-result {
      max-width: 100%;
      overflow: hidden;
      color: #00df82;
      font-size: 16px;
      font-weight: 560;
      letter-spacing: -.025em;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .calculator-backspace {
      position: absolute;
      top: 17px;
      left: 0;
      width: 23px;
      height: 18px;
      place-items: center;
      padding: 0;
      border: 0;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      transition: transform .18s ease, background .18s ease;
    }
    .calculator-keypad {
      display: grid;
      flex: 1;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(5, minmax(0, 1fr));
      gap: 3px;
      min-height: 0;
      overflow:hidden;
      border-radius:16px;
    }
    .calc-key {
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: #eeeeF0;
      color: #151619;
      cursor: pointer;
      font-size: 15px;
      font-weight: 560;
      line-height: 1;
      transition: background .16s ease, color .16s ease, transform .18s cubic-bezier(.2,.8,.2,1), filter .16s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .calc-key:nth-child(4n) { background: #d6d9df; }
    .calc-key:hover { filter: brightness(.96); }
    .calc-key:active { transform: scale(.94); }
    .calc-key.equals { background: #00f58a; }
    .calc-key.equals:hover { filter: brightness(.96); }

    /* Stopwatch / timer */
    .widget-card[data-widget="time"] {
      height: 204px;
      
      background: conic-gradient(#00a4f5 0%, #00e1f3 50%, #f7feff 100%);
      color: #fff;
    }
    .widget-card[data-widget="time"] .widget-header { top: 12px; }
    .widget-card[data-widget="time"] .window-controls { background: rgba(224, 255, 255, .43); }
    .widget-card[data-widget="time"] .window-controls .icon-button::after { background: rgba(0, 92, 143, .55); }
    .widget-card[data-widget="time"] .icon-button { color: rgba(0, 95, 133, .42); }
    .widget-card[data-widget="time"] .icon-button:hover { color: rgba(0, 73, 108, .8); background: rgba(255,255,255,.18); }
    .widget-card[data-widget="time"] .widget-body { padding: 68px 15px 12px; align-items: center; }
    .widget-card[data-widget="time"] .widget-actions { gap: 2px; }
    .time-panel { display: flex; width: 100%; flex-direction: column; align-items: center; padding: 0; }
    .time-panel[hidden] { display: none; }
    .time-display {
      width: 100%;
      margin: 0;
      color: #fff;
      font-size: clamp(39px, 5vw, 55px);
      font-weight: 410;
      letter-spacing: -.065em;
      line-height: 1.15;
      text-align: center;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 10px rgba(0, 79, 128, .08);
      cursor: default;
    }
    .time-display small { color: inherit; font-size: .92em; letter-spacing: inherit; }
    .mode-switch {
      position: absolute;
      right: 50%;
      bottom: 13px;
      display: flex;
      width: fit-content;
      gap: 2px;
      padding: 3px;
      border-radius: 999px;
      background: rgba(255,255,255,.98);
      transform: translateX(50%);
    }
    .mode-switch button {
      min-height: 25px;
      padding: 0 10px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #111;
      cursor: pointer;
      font-size: 10px;
      font-weight: 550;
      letter-spacing: .015em;
      transition: background .2s ease, color .2s ease, transform .2s ease;
    }
    .mode-switch button[aria-pressed="true"] { background: #ececef; color: #050505; }
    .mode-switch button:active { transform: scale(.95); }
    .timer-progress { width: 78%; height: 3px; overflow: hidden; margin: 8px 0 9px; border-radius: 99px; background: rgba(255,255,255,.3); }
    .timer-progress span { display: block; width: 0; height: 100%; border-radius: inherit; background: #fff; transition: width .1s linear; }
    .timer-inputs { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 0; }
    .timer-inputs label { display: grid; gap: 3px; color: rgba(255,255,255,.82); font-size: 9px; text-align: center; }
    .timer-inputs input {
      width: 47px;
      height: 28px;
      padding: 0 4px;
      border: 1px solid rgba(255,255,255,.36);
      border-radius: 7px;
      background: rgba(255,255,255,.22);
      color: #fff;
      text-align: center;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .timer-inputs input::-webkit-inner-spin-button { appearance: none; }
    .time-controls, .lap-list { display: none; }
    .widget-card[data-widget="time"][data-time-mode="timer"] .widget-body { padding-top: 51px; }
    .widget-card[data-widget="time"][data-time-mode="timer"] .time-display { font-size: 39px; }
    .widget-card[data-widget="time"][data-time-mode="timer"] .timer-progress { margin-top: 4px; }

    /* Color picker */
    .widget-card[data-widget="color"] {
      height: 185px;
      
      background: #00ff88;
      color: #050505;
    }
    .widget-card[data-widget="color"] .widget-header { top: 12px; }
    .widget-card[data-widget="color"] .window-controls { background: rgba(255,255,255,.34); }
    .widget-card[data-widget="color"] .window-controls .icon-button::after { background: rgba(0, 116, 93, .5); }
    .widget-card[data-widget="color"] .icon-button { color: rgba(0, 127, 88, .58); }
    .widget-card[data-widget="color"] .icon-button:hover { color: #005f43; background: rgba(0,0,0,.07); }
    .widget-card[data-widget="color"] .widget-body { padding: 45px 15px 9px; }
    .color-preview {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      border: 0;
      border-radius: 0;
      background: transparent;
      transition: background .2s ease;
    }
    .color-code {
      display: block;
      width: 100%;
      min-width: 0;
      margin: auto 0 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: #050505;
      cursor: text;
      font-size: clamp(40px, 5vw, 51px);
      font-weight: 470;
      letter-spacing: -.055em;
      line-height: 1.1;
      text-align: center;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
      caret-color: currentColor;
      transition: color .2s ease, opacity .2s ease;
    }
    .color-code:focus-visible { outline: 0; opacity: .82; }
    .color-caption {
      margin: auto 0 0;
      padding-top: 25px;
      color: #050505;
      font-size: 12px;
      font-weight: 450;
      letter-spacing: .015em;
      line-height: 1;
    }
    .color-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      border: 0;
      opacity: 0;
      pointer-events: none;
    }
    .color-fields, .rgb-value { display: none !important; }

    /* Memo: compact note list, with a separate title/body editor. */
    .widget-card[data-widget="memo"] { height: 260px;  }
    .widget-card[data-widget="memo"] .widget-header { top: 12px; }
    .widget-card[data-widget="memo"] .widget-actions { gap: 0; }
    .widget-card[data-widget="memo"] .widget-body { padding: 50px 16px 14px; }
    .memo-list {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      gap: 8px;
      overflow: auto;
      scrollbar-width: none;
      overscroll-behavior: contain;
      padding-bottom: 2px;
    }
    .memo-list::-webkit-scrollbar { display: none; }
    .memo-item {
      display: grid;
      width: 100%;
      min-height: 54px;
      flex: 0 0 54px;
      grid-template-columns: minmax(0, 1fr) minmax(0, 43%);
      align-items: center;
      gap: 9px;
      padding: 7px 13px;
      border: 0;
      border-radius: 17px;
      background: #eeeeF0;
      color: #08090b;
      text-align: left;
      cursor: pointer;
      transition: background .16s ease, transform .2s cubic-bezier(.2,.8,.2,1);
    }
    .memo-item:hover { background: #e7e7ea; }
    .memo-item:active { transform: scale(.985); }
    .memo-item-title {
      display: block;
      min-width: 0;
      overflow: hidden;
      font-size: 19px;
      font-weight: 650;
      letter-spacing: -.04em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .memo-item-preview {
      display: -webkit-box;
      min-width: 0;
      overflow: hidden;
      color: #a4a5aa;
      font-size: 10px;
      font-weight: 450;
      line-height: 1.28;
      letter-spacing: -.015em;
      overflow-wrap: anywhere;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .memo-empty {
      display: grid;
      flex: 1;
      place-items: center;
      color: #a5a6ab;
      font-size: 13px;
    }
    .memo-editor {
      position: relative;
      z-index: 1;
      display: flex;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      gap: 9px;
      padding: 0;
      background: #fff;
      animation: memo-editor-in .2s cubic-bezier(.2,.8,.2,1) both;
    }
    .memo-editor[hidden], .memo-list[hidden], .memo-empty[hidden] { display: none !important; }
    @keyframes memo-editor-in {
      from { opacity: 0; transform: translateY(5px) scale(.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .memo-title-input {
      width: 100%;
      height: 41px;
      flex: 0 0 auto;
      padding: 0 12px;
      border: 0;
      border-radius: 12px;
      outline: 0;
      background: #eeeeF0;
      color: #08090b;
      font-size: 16px;
      font-weight: 650;
    }
    .memo-body-input {
      width: 100%;
      min-height: 0;
      flex: 1;
      resize: none;
      padding: 11px 12px;
      border: 0;
      border-radius: 12px;
      outline: 0;
      background: #f3f3f5;
      color: #202124;
      font-size: 13px;
      line-height: 1.65;
    }
    .memo-editor-actions {
      display: flex;
      flex: 0 0 auto;
      justify-content: flex-end;
      gap: 7px;
    }
    .memo-editor-actions .primary-button,
    .memo-editor-actions .subtle-button { min-height: 32px; }
    .memo-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

    /* Calendar */
    .widget-card[data-widget="calendar"] { min-height: 320px;  }
    .widget-card[data-widget="calendar"] .widget-body { padding: 52px 17px 17px; }
    .calendar-topline { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 13px; }
    .calendar-month { font-size: 21px; font-weight: 680; letter-spacing: -.045em; }
    .calendar-year { margin-left: 7px; color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: 0; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
    .calendar-weekday { padding: 5px 0 7px; color: #a3a5ac; font-size: 10px; text-align: center; }
    .calendar-day {
      position: relative;
      display: grid;
      min-width: 0;
      min-height: 31px;
      place-items: center;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #42454c;
      cursor: pointer;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      transition: background .16s ease, color .16s ease, transform .16s ease;
    }
    .calendar-day:hover { background: #f0f0f2; }
    .calendar-day:active { transform: scale(.9); }
    .calendar-day.outside { color: #c3c5ca; }
    .calendar-day.today { color: #00bb72; font-weight: 750; }
    .calendar-day.selected { background: #00e783; color: #07130d; font-weight: 700; }
    .calendar-day.has-event::after { position: absolute; bottom: 3px; width: 3px; height: 3px; border-radius: 50%; background: #00bf75; content: ""; }
    .calendar-day.selected.has-event::after { background: #07130d; }
    .calendar-event-editor { margin-top: 14px; padding-top: 12px; border-top: 1px solid #ececef; display:none; }
    .calendar-selected-date { margin-bottom: 7px; color: #64666d; font-size: 11px; font-weight: 650; }
    .calendar-event-row { display: flex; gap: 6px; }
    .calendar-event-row input {
      min-width: 0;
      flex: 1;
      height: 34px;
      padding: 0 10px;
      border: 0;
      border-radius: 9px;
      background: #f0f0f2;
      color: var(--text);
      font-size: 12px;
    }
    .primary-button, .subtle-button {
      min-height: 34px;
      padding: 0 11px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 620;
      transition: background .16s ease, transform .16s ease;
    }
    .primary-button { background: #00e783; color: #06150e; }
    .primary-button:hover { background: #00d97a; }
    .subtle-button { background: #eeeeF0; color: #53555c; }
    .subtle-button:hover { background: #e2e3e6; }
    .primary-button:active, .subtle-button:active { transform: scale(.95); }

    /* Full-viewport maximize layer. The original grid slot stays in place. */
    .widget-placeholder {
      display: block;
      width: 100%;
      min-width: 0;
      height: var(--placeholder-height, 1px);
      min-height: var(--placeholder-height, 1px);
      visibility: hidden;
      pointer-events: none;
    }
    .maximize-layer {
      position: fixed;
      z-index: 10000;
      inset: 0;
      display: block;
      overflow: hidden;
      background: rgba(240, 240, 242, .96);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: opacity .46s ease, visibility 0s linear .48s;
      isolation: isolate;
    }
    .maximize-layer.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity .3s ease, visibility 0s;
    }
    .maximize-layer.is-closing {
      opacity: 0;
      visibility: visible;
      pointer-events: none;
      transition: opacity .46s ease, visibility 0s;
    }
    .maximize-layer .widget-card {
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-height: none;
      flex-direction: column;
      margin: 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      transform-origin: top left;
      transform: translate3d(0,0,0) scale(1);
      transition: transform .48s cubic-bezier(.2,.88,.28,1), border-radius .48s cubic-bezier(.2,.88,.28,1);
      will-change: transform, border-radius;
      animation: none;
    }
    .maximize-layer .widget-body {
      min-height: 0;
      flex: 1;
      overflow: auto;
      padding: clamp(24px, 5vw, 64px);
    }
    .maximize-layer .widget-header { top: 22px; right: 24px; left: 26px; }
    .maximize-layer .calculator-keypad { gap: 10px; }
    .maximize-layer .calc-key { border-radius: 16px; font-size: clamp(20px, 2.5vw, 34px); }
    .maximize-layer .time-display { font-size: clamp(70px, 14vw, 160px); }
    .maximize-layer .mode-switch { bottom: 28px; }
    .maximize-layer .widget-card[data-widget="calculator"] .widget-body { padding: 100px clamp(22px, 8vw, 130px) 36px; }
    .maximize-layer .calculator-display { min-height: clamp(150px, 24vh, 260px); }
    .maximize-layer .calculator-expression { font-size: clamp(42px, 6vw, 76px); min-height: 1.35em; }
    .maximize-layer .calculator-result { font-size: clamp(25px, 3vw, 42px); }
    .maximize-layer .widget-card[data-widget="color"] .widget-body { padding: 100px 28px 40px; }
    .maximize-layer .color-code { font-size: clamp(64px, 11vw, 150px); }
    .maximize-layer .color-caption { font-size: clamp(14px, 2vw, 22px); padding-top: 42px; }
    .maximize-layer .widget-card[data-widget="memo"] .widget-body { padding: 88px 28px 32px; }
    .maximize-layer .memo-list { gap: 12px; }
    .maximize-layer .memo-item { min-height: 80px; flex-basis: 80px; padding: 12px 20px; border-radius: 22px; }
    .maximize-layer .memo-item-title { font-size: clamp(22px, 3vw, 34px); }
    .maximize-layer .memo-item-preview { font-size: clamp(12px, 1.5vw, 17px); }
    .maximize-layer .memo-editor { gap: 14px; }
    .maximize-layer .memo-title-input { height: 58px; font-size: clamp(22px, 2.5vw, 32px); }
    .maximize-layer .memo-body-input { font-size: clamp(16px, 2vw, 24px); }
    .maximize-layer .memo-editor-actions .primary-button,
    .maximize-layer .memo-editor-actions .subtle-button { min-height: 44px; padding: 0 20px; font-size: 14px; }

    .toast-region {
      position: fixed;
      z-index: 11000;
      right: 20px;
      bottom: 20px;
      display: grid;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      max-width: min(340px, calc(100vw - 40px));
      padding: 11px 15px;
      border: 0;
      border-radius: 12px;
      background: #202124;
      box-shadow: 0 8px 24px rgba(0,0,0,.15);
      color: white;
      font-size: 12px;
      animation: toast-in .22s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes toast-in { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

    body.pip-mode { min-width: 280px; min-height: 100vh; padding: 9px; background: var(--page-bg); }
    body.pip-mode .widget-card {
      display: flex;
      width: 100%;
      min-height: calc(100vh - 18px);
      flex-direction: column;
      margin: 0;
      border-radius: 24px;
      box-shadow: none;
      animation: none;
    }
    body.pip-mode .widget-body { flex: 1; }
    body.pip-mode .widget-heading { max-width: 34%; }

    @media (max-width: 700px) {
      .main-container { width: min(100% - 24px, 520px); padding: 28px 0 36px; }
      .dashboard-heading { margin-bottom: 22px; }
      .dashboard-heading h1 { font-size: 24px; }
      .profile-link { min-height: 35px; padding: 0 13px; font-size: 19px; }
      .dashboard-masonry { display: grid; grid-template-columns: minmax(0, 1fr); row-gap: 0; }
      .dashboard-column { display: contents; }
      .widget-card { width: 100%; margin-bottom: 16px; }
      .widget-card[data-widget="calculator"] { height: 320px; }
      .widget-card[data-widget="time"] { height: 204px; }
      .widget-card[data-widget="color"] { height: 185px; }
      .widget-card[data-widget="memo"] { height: 260px; }
      .widget-card[data-widget="calculator"] { order: 1; }
      .widget-card[data-widget="time"] { order: 2; }
      .widget-card[data-widget="color"] { order: 3; }
      .widget-card[data-widget="memo"] { order: 4; }
      .widget-card[data-widget="calendar"] { order: 5; }
      .widget-card[data-widget="time"] .time-display { font-size: clamp(43px, 11vw, 58px); }
      .maximize-layer .widget-card { width: 100vw; height: 100vh; height: 100dvh; }
      .maximize-layer .widget-card[data-widget="calculator"] .widget-body { padding: 90px 18px 25px; }
      .maximize-layer .widget-card[data-widget="memo"] .widget-body { padding: 76px 16px 20px; }
      .maximize-layer .memo-item { grid-template-columns: minmax(0, 1fr) minmax(0, 42%); }
    }
    @media (max-width: 390px) {
      .main-container { width: calc(100% - 20px); }
      .dashboard-masonry { column-gap: 0; }
      .widget-card[data-widget="calculator"] { height: 305px; }
      .widget-card[data-widget="calculator"] .widget-body { padding-right: 13px; padding-left: 13px; }
      .calculator-keypad { gap: 4px; }
      .calc-key { border-radius: 9px; }
      .widget-card[data-widget="time"] .time-display { font-size: 43px; }
      .color-code { font-size: 44px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

      isolation: isolate;

    /* Floating three-pill dock */
    :root {
      --widget-strip-white: #ffffff;
      --widget-strip-ink: #080808;
    }
    .widget-strip {
      position: fixed;
      z-index: 9000;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      width: min(437px, calc(100vw - 24px));
      aspect-ratio: 437 / 65;
      transform: translate3d(-50%, 0, 0);
      will-change: transform, opacity, filter;
      animation: widget-dock-arrive .72s cubic-bezier(.22, 1, .36, 1) .18s both;
      transition:
        opacity .3s ease,
        transform .52s cubic-bezier(.22, 1, .36, 1),
        filter .38s ease;
    }
    .widget-strip__clock-text,
    .widget-strip__calendar-text,
    .widget-strip__value-text {
      font-family: "TikTok Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    .widget-strip.is-arrived {
      animation: none;
    }
    @keyframes widget-dock-arrive {
      from { opacity: 0; transform: translate3d(-50%, 22px, 0) scale(.96); filter: blur(7px); }
      to { opacity: 1; transform: translate3d(-50%, 0, 0) scale(1); filter: blur(0); }
    }
    body.is-maximized .widget-strip {
      animation: none;
      opacity: 0;
      transform: translate3d(-50%, 22px, 0) scale(.94);
      filter: blur(8px);
      pointer-events: none;
    }

    /* Snapshot-based card morph: the preview keeps the original layout while zooming. */
    .maximize-layer {
      background: rgba(241, 241, 243, .78);
      backdrop-filter: blur(24px) saturate(1.35);
      -webkit-backdrop-filter: blur(24px) saturate(1.35);
      transition: opacity .34s cubic-bezier(.22, 1, .36, 1), visibility 0s linear .4s;
    }
    .maximize-layer.is-open {
      transition: opacity .28s cubic-bezier(.22, 1, .36, 1), visibility 0s;
    }
    .maximize-layer.is-closing {
      transition: opacity .38s cubic-bezier(.32, 0, .18, 1), visibility 0s;
    }
    .maximize-layer .widget-card {
      z-index: 1;
      transition: opacity .16s ease;
    }
    .widget-card.is-transition-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
    }
    .widget-card--transition-snapshot {
      position: fixed !important;
      z-index: 2 !important;
      display: flex !important;
      margin: 0 !important;
      transform-origin: top left !important;
      pointer-events: none !important;
      animation: none !important;
      transition: none !important;
      will-change: transform, border-radius;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .maximize-layer .widget-header {
      top: calc(22px + env(safe-area-inset-top, 0px));
      right: calc(24px + env(safe-area-inset-right, 0px));
      left: calc(26px + env(safe-area-inset-left, 0px));
    }
    .maximize-layer .widget-body {
      padding-bottom: calc(clamp(24px, 5vw, 64px) + env(safe-area-inset-bottom, 0px));
    }

    .main-container {
      padding-bottom: calc(48px + 88px + env(safe-area-inset-bottom, 0px));
    }
    @media (max-width: 700px) {
      .main-container {
        padding-bottom: calc(36px + 86px + env(safe-area-inset-bottom, 0px));
      }
      .widget-strip {
        width: min(437px, calc(100vw - 28px));
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .widget-strip {
        animation: none !important;
        transition: none !important;
      }
      .widget-card--transition-snapshot { display: none !important; }
      .maximize-layer,
      .maximize-layer.is-open,
      .maximize-layer.is-closing {
        transition: none !important;
      }
    }
